# cachette configuration - generated from the config schema.
# Every knob is present; optional keys are commented out with their defaults.

[server]
# data_path = "/etc/cachette" # directory -> <dir>/cachette.db, or a .db file path
listen = "0.0.0.0:8080" # runner-facing listener (host:port)
# external_url = "http://127.0.0.1:8080" # runner-visible base URL
max_size = 0 # 0 = use disk total; accepts bytesizes like "32GiB"
eviction = "lru" # lru | oldest | none
key_case = "preserve" # preserve | lower
reservation_ttl_seconds = 3600 # reservation lifetime
max_chunk_bytes = 67108864 # largest single upload chunk
drain_grace_seconds = 30 # graceful-shutdown window
# tls_cert = "/etc/cachette/tls.crt" # TLS cert (must be set with tls_key)
# tls_key = "/etc/cachette/tls.key" # TLS key
level = "info" # log level
format = "text" # text | json

[auth]
mode = "merge" # hmac | bearer | merge
secret = "CHANGE_ME_MIN_16_CHARS" # HMAC key (minimum 16 characters)
# tokens = [] # static bearer tokens
hmac_max_age_seconds = 600 # 0 disables the staleness check
signed_url_ttl_seconds = 900 # v1/v2 capability URL lifetime
# jwt_secret = "CHANGE_ME_MIN_16_CHARS" # falls back to [auth] secret
jwt_ttl_seconds = 300 # Twirp v2 JWT lifetime
# oidc_jwks_refresh_seconds = 1800 # JWKS prefetch interval
# oidc_jwks_max_keys = 32 # cached-key cap
# oidc_jwks_ca_pem = "/etc/ssl/certs/ca-certificates.crt" # default JWKS trust roots

[auth.forge."<forge>"]
hmac_secret = "CHANGE_ME_MIN_16_CHARS" # runner cache.secret; yields forge + signed repo tenant
# runtime_secret = "/etc/cachette/forge-token.secret" # file holding the forge's token signing secret
# runtime_tenant_claim = "oidc_extra.repository" # where the runtime token carries the tenant
# oidc_issuer = "https://idp.example.org/realms/ci" # exact iss claim for this forge
# oidc_audiences = ["cachette"] # accepted aud values
# oidc_jwks_url = "https://idp.example.org/realms/ci/protocol/openid-connect/certs" # explicit JWKS endpoint
# oidc_tenant_claim = "repository" # claim whose value becomes the tenant
# oidc_require = { "groups" = "ci" } # claim pins
# oidc_leeway_seconds = 30 # clock skew

[storage.fs]
path = "/var/lib/cachette" # legacy local root; also the default control-DB directory
min_free = 0.2 # default free-space floor for all instances

[storage]
# routes = {} # resolved namespace -> instance; see [storage.routes]

[storage.cdc]
enabled = false # content-defined chunking
# avg_chunk_bytes = 131072 # target mean chunk size
# backfill = true # convert existing whole entries
# backfill_delay_ms = 100 # pace between conversions

[[storage.instances]]
name = "default" # routing target; repeat this block for more instances
type = "fs" # fs | s3 | webdav | copyparty | azure | ftp | sftp
path = "/var/lib/cachette" # local root (also the mount point for mounted SMB/NFS/WebDAV)
# mount_url = "//nas.example.org/cache" # documentation only: what is mounted at path
# bucket = "cachette" # required for type = "s3"
# region = "us-east-1" # S3 region
# endpoint = "https://minio.example.org:9000" # custom S3 endpoint (path-style addressing)
# url = "https://copyparty.example.org/cachette/" # endpoint for webdav/copyparty/ftp/sftp instances
# prefix = "blobs" # key prefix inside the remote store
# username = "cachette" # remote username / basic auth
# password_file = "/etc/cachette/remote.password" # file holding the remote password or copyparty PW header
# ca_pem = "/etc/ssl/certs/ca-certificates.crt" # trust roots; required whenever the endpoint is https
# access_key = "CHANGE_ME" # S3 access key fallback (AWS_ACCESS_KEY_ID wins)
# secret_key = "CHANGE_ME" # S3 secret key fallback (AWS_SECRET_ACCESS_KEY wins)
# wsalt = "hunter2" # copyparty file-ID salt (must match server --wsalt)
# account = "cachetteaccount" # Azure storage account (env AZURE_STORAGE_ACCOUNT wins)
# container = "cachette" # Azure blob container
# private_key_file = "/etc/cachette/id_sftp" # SSH key for type = "sftp" (agent/key auth only)

[[quota]]
scope = "namespace" # namespace | instance
target = "*" # exact name or glob
limit = "20GiB" # positive bytesize

[cluster]
enabled = false # peer-to-peer clustering
listen = "0.0.0.0:8081" # always-mTLS peer listener
# advertise_addr = "0.0.0.0:8081" # peer-facing address
# node_id = "node-a" # override the fingerprint node id
# mdns = true # mDNS discovery
# seeds = [] # static peer addresses
# seed_fingerprints = {} # static peer pin map
# tiebreak = "random" # placement tie-break
# heartbeat_interval_seconds = 5 # heartbeat cadence
# peer_timeout_seconds = 15 # peer staleness window
# cert_path = "/etc/cachette/identity" # identity key/cert directory

[log]
# file = "/var/log/cachette.log" # log file (stdout when unset)
