[package]
name = "cachette"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.2", features = ["full"] }
tower = "=0.5.3"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.9"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
rustls = "=0.23"
rustls-pemfile = "=2.2.0"
tokio-rustls = "=0.26"
rcgen = "=0.13"
rusqlite = { version = "=0.32", features = ["bundled"] }
mdns-sd = "=0.21.5"
hmac = "=0.13.0"
sha2 = "=0.11.0"
blake3 = "=1.8.7"
base64 = "=0.22"
url = "=2.5.8"
thiserror = "=2"
tower-http = { version = "=0.6", features = ["trace", "catch-panic"] }
fs2 = "=0.4.3"
