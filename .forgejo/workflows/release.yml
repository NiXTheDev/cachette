# Release pipeline for cachette (plan task 36):
#   cross-compiled binary matrix + multi-arch Docker image push.
#
# =============================================================================
# TOOLCHAIN JUSTIFICATION (required by plan): cargo-zigbuild for the Linux legs
# =============================================================================
# Goal: fully STATIC `*-unknown-linux-musl` binaries that run on any Linux
# distro without glibc-version coupling. A musl build needs (a) musl libc,
# (b) a linker + C toolchain for the C code pulled in by dependencies
# (`rusqlite/bundled` compiles SQLite C; `ring` has C/asm; cc-rs in general):
#
#   * `x86_64-unknown-linux-musl` is a SELF-CONTAINED rustc target (rustup
#     ships its own libc.a) - it only needs a linker, so it would build with
#     nothing exotic. But:
#   * `aarch64-unknown-linux-musl` is Tier 2 WITHOUT host tools: rustup
#     installs std, but an x86_64 runner has no aarch64 musl libc/linker.
#     apt's `musl-tools` only covers the HOST arch; hand-rolling an aarch64
#     cross toolchain (cross-gcc + aarch64 musl libc) is the fragile setup the
#     plan explicitly asks us to avoid.
#   * `cargo-zigbuild` drives `zig cc` as the linker/C compiler for BOTH
#     targets: zig ships its own libc (including musl) and understands rustc's
#     target triples, so ONE toolchain covers x86_64 + aarch64 musl uniformly -
#     no QEMU, no system packages beyond `zig` itself.
#
# Why NOT `cross` (plan: must NOT add `cross` unless zigbuild fails):
#   `cross` pulls prebuilt Docker images (ghcr.io/cross-rs/*) and runs every
#   build inside a container - heavier (docker-in-CI per leg), slow cold
#   starts, and it would duplicate what zigbuild already does here. It stays
#   the documented fallback: if a future zig / cargo-zigbuild regression makes
#   the musl legs fail, replace the two `if: matrix.zigbuild == true` steps
#   with `cross build --target <triple> --release` and record the reason in
#   this comment (NOT silently in a follow-up commit).
#
# Windows legs need no extra toolchain:
#   * x86_64-pc-windows-msvc  - native on windows-latest, links with MSVC.
#   * aarch64-pc-windows-msvc - cross-links with the VS ARM64 C++ toolchain
#     that ships on windows-latest images (VC.Tools.ARM64); the resulting
#     ARM64 PE cannot EXECUTE on the x64 runner, so it is verified structurally
#     below (PE COFF machine == 0xAA64 - the exact fact `file(1)` would report;
#     a `file`-based check runs too whenever `file` exists on the runner).
#
# Local-dev limitation (recorded by task 36): the dev workstation has NO
# zig/cargo-zigbuild and only the x86_64-pc-windows-msvc rustup target
# installed, so the cross legs are CI-validated only; the YAML itself is
# gated locally with `actionlint` (0 errors).
#
# Acceptance criterion 12:
#   * native artifacts (linux x86_64-musl, windows x86_64-msvc) RUN
#     `cachette --version` and assert stdout == `cachette 0.1.0`.
#   * cross artifacts are verified via `file`/`uname` (linux) and the
#     PE-machine equivalent (windows).
# =============================================================================
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zigbuild: true
            artifact: cachette-x86_64-unknown-linux-musl
            bin: cachette
            smoke: run
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zigbuild: true
            artifact: cachette-aarch64-unknown-linux-musl
            bin: cachette
            smoke: cross-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zigbuild: false
            artifact: cachette-x86_64-pc-windows-msvc
            bin: cachette.exe
            smoke: run
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            zigbuild: false
            artifact: cachette-aarch64-pc-windows-msvc
            bin: cachette.exe
            smoke: cross-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ---- Linux musl legs: cargo-zigbuild (justification block at top) ----
      # If a zig release ever regresses cargo-zigbuild, pin a known-good one
      # here (e.g. `with: { version: 0.14.1 }`) and note it in the header.
      - name: Install zig (C toolchain for cargo-zigbuild)
        if: matrix.zigbuild == true
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.zigbuild == true
        run: cargo install cargo-zigbuild --locked

      - name: Build (cargo zigbuild -> static musl)
        if: matrix.zigbuild == true
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      # ---- Windows legs: plain cargo build (MSVC; ARM64 tools preinstalled) ----
      - name: Build (cargo build, MSVC)
        if: matrix.zigbuild == false
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ---- Smoke: native artifacts actually RUN --version ----
      - name: Smoke - run native binary (--version -> "cachette 0.1.0")
        if: matrix.smoke == 'run'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$bin" || true
          command -v file >/dev/null 2>&1 && file "$bin"
          got="$("$bin" --version | tr -d '\r')"
          echo "cachette --version => [$got]"
          if [ "$got" != "cachette 0.1.0" ]; then
            echo "::error::expected exactly 'cachette 0.1.0', got '$got'"
            exit 1
          fi

      # ---- Smoke: cross Linux artifact (file/uname - cannot execute) ----
      - name: Smoke - cross linux artifact (file + uname)
        if: matrix.smoke == 'cross-linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$bin"
          echo "uname -m (host arch): $(uname -m)"
          test "$(uname -m)" = "x86_64"
          echo "file(1) output:"
          file "$bin"
          file "$bin" | grep -qi "aarch64"
          file "$bin" | grep -Eq "statically linked|static-pie linked"
          echo "OK: aarch64 musl STATIC artifact, host is x86_64 (cross build proven)"

      # ---- Smoke: cross Windows artifact ----
      # file(1) may be absent from the runner's Git Bash - run it when present,
      # then ALWAYS assert the PE COFF machine field below (stronger/equal proof).
      - name: Smoke - cross windows artifact (file, if available)
        if: matrix.smoke == 'cross-windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if command -v file >/dev/null 2>&1; then
            echo "file(1) output:"
            file "$bin"
            file "$bin" | grep -qiE "arm64|aarch64"
          else
            echo "file(1) not on this runner - PE machine asserted in the next step"
          fi

      - name: Smoke - cross windows artifact (PE machine == ARM64)
        if: matrix.smoke == 'cross-windows'
        shell: pwsh
        run: |
          $path = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $peOff  = [BitConverter]::ToInt32($bytes, 0x3C)     # e_lfanew
          $peSig  = [BitConverter]::ToUInt32($bytes, $peOff)  # "PE\0\0"
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          Write-Host ("PE header @ 0x{0:X}; signature 0x{1:X8}; machine 0x{2:X4}" -f $peOff, $peSig, $machine)
          if ($peSig -ne 0x00004550) { throw "not a PE file" }
          if ($machine -ne 0xAA64) { throw ("expected ARM64 machine 0xAA64, got 0x{0:X4}" -f $machine) }
          Write-Host "OK: PE machine 0xAA64 = ARM64 (aarch64-pc-windows-msvc)"

      # ---- Stage + upload one artifact per target ----
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          ls -l dist

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.bin }}
          if-no-files-found: error

  docker:
    name: docker multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to ghcr.io on tag builds only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 builder stage emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref
        id: ref
        shell: bash
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/cachette"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            push=true
          else
            tag="sha-${GITHUB_SHA:0:12}"
            push=false
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${tag} push=${push}"

      # THE exact multi-arch push command from plan task 36. Runs ONLY in CI on
      # tag pushes - NOTHING is ever pushed from a dev workstation (the worker's
      # local gate is `buildx --load` amd64 only, see the dry-run step below).
      - name: Build + push multi-arch manifest (linux/amd64,linux/arm64)
        if: steps.ref.outputs.push == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}" \
            --tag "${{ steps.ref.outputs.image }}:latest" \
            --push \
            .

      # Acceptance criterion 12 (docker half): the pushed tag must be a
      # manifest list covering BOTH architectures.
      - name: Verify manifest lists amd64 AND arm64
        if: steps.ref.outputs.push == 'true'
        run: |
          ref="${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}"
          manifest="$(docker manifest inspect "$ref")"
          echo "$manifest"
          echo "$manifest" | grep -q '"architecture": "amd64"'
          echo "$manifest" | grep -q '"architecture": "arm64"'
          echo "OK: $ref is a manifest list with amd64 + arm64"
          echo "(equivalent: docker buildx imagetools inspect $ref)"

      # Non-tag runs are a DRY RUN: amd64 only, local --load, no registry.
      - name: Dry run (amd64 --load only, no push without a registry)
        if: steps.ref.outputs.push == 'false'
        run: |
          docker buildx build --load --platform linux/amd64 --tag cachette:ci-dryrun .
          got="$(docker run --rm cachette:ci-dryrun --version)"
          echo "cachette --version => [$got]"
          [ "$got" = "cachette 0.1.0" ]
