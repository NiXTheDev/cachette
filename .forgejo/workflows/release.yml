# Release pipeline for cachette (plan task 53; supersedes the task-36/38 drafts):
#   cross-compiled binary matrix -> checksums -> release.
#
# The OCI image is NOT built here. regexYbot-shaped split: the docker image
# work (multi-arch build, registry push on `refs/heads/release`, validation
# builds everywhere else) lives in push-checks.yml / pr-checks.yml, so the
# publish machinery is exercised by the ordinary checks on every merge - and a
# merge into `release` fires BOTH this pipeline (binaries + checksums + release)
# and push-checks.yml (the image) at the same time.
#
# Runs on tag pushes (`v*`) AND on pushes to the long-lived `release` branch (the
# merge commit of a `feat/*` -> release pull request), and can be dispatched
# manually. Tag pushes publish under the tag; `release`-branch pushes publish
# under the crate version (`v<version>` from Cargo.toml), so merging the PR is
# what cuts a release. On a manual dispatch (no tag, non-release branch) the
# build + checksums still run, but nothing is published.
#
# =============================================================================
# TOOLCHAIN JUSTIFICATION (required by plan): cargo-zigbuild for the Linux legs
# =============================================================================
# Goal: fully STATIC `*-unknown-linux-musl` binaries that run on any Linux
# distro without glibc-version coupling. A musl build needs (a) musl libc,
# (b) a linker + C toolchain for the C code pulled in by dependencies
# (`rusqlite/bundled` compiles SQLite C; `ring` has C/asm; cc-rs in general):
#
#   * `x86_64-unknown-linux-musl` is a SELF-CONTAINED rustc target (rustup
#     ships its own libc.a) - it only needs a linker, so it would build with
#     nothing exotic. But:
#   * `aarch64-unknown-linux-musl` is Tier 2 WITHOUT host tools: rustup
#     installs std, but an x86_64 runner has no aarch64 musl libc/linker.
#     apt's `musl-tools` only covers the HOST arch; hand-rolling an aarch64
#     cross toolchain (cross-gcc + aarch64 musl libc) is the fragile setup the
#     plan explicitly asks us to avoid.
#   * `cargo-zigbuild` drives `zig cc` as the linker/C compiler for BOTH
#     targets: zig ships its own libc (including musl) and understands rustc's
#     target triples, so ONE toolchain covers x86_64 + aarch64 musl uniformly -
#     no QEMU, no system packages beyond `zig` itself.
#
# Why NOT `cross` (plan: must NOT add `cross` unless zigbuild fails):
#   `cross` pulls prebuilt Docker images (ghcr.io/cross-rs/*) and runs every
#   build inside a container - heavier (docker-in-CI per leg), slow cold
#   starts, and it would duplicate what zigbuild already does here. It stays
#   the documented fallback: if a future zig / cargo-zigbuild regression makes
#   the musl legs fail, replace the two `if: matrix.zigbuild == true` steps
#   with `cross build --target <triple> --release` and record the reason in
#   this comment (NOT silently in a follow-up commit).
#
# Windows legs are cross-built on Linux by cargo-zigbuild like everything else:
#   * x86_64-pc-windows-gnu / aarch64-pc-windows-gnu are Tier 2 rustup targets
#     whose mingw-w64 link step `zig cc` satisfies; no Windows-native toolchain
#     (no MSVC, no windows-latest legs) is involved. A cross-built PE cannot
#     execute on the Linux runner, so the artifacts are verified structurally:
#     the PE COFF machine field must be 0x8664 (x86_64) or 0xAA64 (ARM64) -
#     the exact fact `file(1)` would report; a `file`-based check runs too
#     whenever `file` exists on the runner.
#
# Local-dev limitation (recorded by task 36): the dev workstation has NO
# zig/cargo-zigbuild and only the x86_64-pc-windows-msvc rustup target
# installed, so the cross legs are CI-validated only; the YAML itself is
# gated locally with `actionlint` (0 errors).
#
# Native artifacts (linux x86_64-musl, windows x86_64-msvc) RUN
# `cachette --version` and assert stdout == `cachette 1.0.0`; cross artifacts
# are verified via `file`/`uname` (linux) and the PE-machine equivalent.
#
# =============================================================================
# PUBLISHING (plan task 53): the forge release + its binaries. Binaries +
# SHA256SUMS are attached to the Forgejo release. The release tag is
# `v<version>`: the pushed tag on a tag push, or the Cargo.toml package version
# on a push to the `release` branch (so merging a `feat/*` PR into `release`
# cuts the release). The image side of a release (bare-semver tags
# `1.0.0`/`1.0`/`1` + `latest` + `release` at
# `hangar.nixthedev.ru/<owner>/cachette`) is pushed by push-checks.yml's docker
# job on the same merge.
# =============================================================================
name: Release

on:
  push:
    # `tags` and `branches` are OR-ed: either ref starts the full pipeline.
    tags: ["v*"]
    branches: ["release"]
  workflow_dispatch:

# NOTE (Forgejo): a `permissions:` key is NOT supported - the instance logs
# "Job ... has a permissions field, which is not supported in Forgejo and will
# be ignored. Use Authorized Integrations ...". Registry/release capabilities
# come from the forge's Authorized Integrations, so none is declared here.

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve the version and whether this run publishes. There are exactly two
  # publishing refs:
  #   * a `v*` tag            -> version = the tag minus its leading `v`
  #   * the `release` branch  -> version = Cargo.toml's `[package] version`
  # Every other ref (manual dispatch on a feature branch) builds binaries +
  # checksums but never publishes.
  version:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Resolve version and publish flag
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          elif [[ "${GITHUB_REF}" == refs/heads/release ]]; then
            # First `version = "..."` in the manifest is the package version.
            version="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml \
              | sed -E 's/[^"]*"([^"]*)".*/\1/')"
            publish=true
          else
            version="0.0.0-${GITHUB_SHA:0:12}"
            publish=false
          fi
          if [[ -z "$version" ]]; then
            echo "::error::could not resolve a version from ${GITHUB_REF}"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_REF} version=$version tag=v$version publish=$publish"

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zigbuild: true
            artifact: cachette-x86_64-unknown-linux-musl
            bin: cachette
            smoke: run
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zigbuild: true
            artifact: cachette-aarch64-unknown-linux-musl
            bin: cachette
            smoke: cross-linux
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            zigbuild: true
            artifact: cachette-x86_64-pc-windows-msvc
            bin: cachette.exe
            smoke: cross-windows
          - os: ubuntu-latest
            target: aarch64-pc-windows-gnu
            zigbuild: true
            artifact: cachette-aarch64-pc-windows-msvc
            bin: cachette.exe
            smoke: cross-windows
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Install stable Rust ${{ matrix.target }}
        id: toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache the per-target toolchain + std libs (the slow rustup leg on these
      # runners); matrix.target keeps the different std libraries apart, and
      # dtolnay's `cachekey` output pins the exact stable version.
      - name: Cache rustup toolchains
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: cachette-rustup-${{ matrix.target }}-${{ steps.toolchain.outputs.cachekey }}

      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ---- Linux musl legs: cargo-zigbuild (justification block at top) ----
      # If a zig release ever regresses cargo-zigbuild, pin a known-good one
      # here (e.g. `with: { version: 0.14.1 }`) and note it in the header.
      - name: Install zig
        if: matrix.zigbuild == true
        uses: https://github.com/mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.zigbuild == true
        run: cargo install cargo-zigbuild --locked

      - name: Build
        if: matrix.zigbuild == true
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      # ---- Smoke: native artifacts actually RUN --version ----
      - name: Smoke - run native binary --version
        if: matrix.smoke == 'run'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$bin" || true
          command -v file >/dev/null 2>&1 && file "$bin"
          got="$("$bin" --version | tr -d '\r')"
          echo "cachette --version => [$got]"
          if [ "$got" != "cachette 1.0.0" ]; then
            echo "::error::expected exactly 'cachette 1.0.0', got '$got'"
            exit 1
          fi

      # ---- Smoke: cross Linux artifact (file/uname - cannot execute) ----
      - name: Smoke - cross linux artifact
        if: matrix.smoke == 'cross-linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$bin"
          echo "uname -m (host arch): $(uname -m)"
          test "$(uname -m)" = "x86_64"
          echo "file(1) output:"
          file "$bin"
          file "$bin" | grep -qi "aarch64"
          file "$bin" | grep -Eq "statically linked|static-pie linked"
          echo "OK: aarch64 musl STATIC artifact, host is x86_64 (cross build proven)"

      # ---- Smoke: cross Windows artifact ----
      # file(1) may be absent from the runner's Git Bash - run it when present,
      # then ALWAYS assert the PE COFF machine field below (stronger/equal proof).
      - name: Smoke - cross windows artifact file
        if: matrix.smoke == 'cross-windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if command -v file >/dev/null 2>&1; then
            echo "file(1) output:"
            file "$bin"
            file "$bin" | grep -qiE "arm64|aarch64"
          else
            echo "file(1) not on this runner - PE machine asserted in the next step"
          fi

      - name: Smoke - cross windows artifact PE machine
        if: matrix.smoke == 'cross-windows'
        shell: pwsh
        run: |
          $path = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $peOff  = [BitConverter]::ToInt32($bytes, 0x3C)     # e_lfanew
          $peSig  = [BitConverter]::ToUInt32($bytes, $peOff)  # "PE\0\0"
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          Write-Host ("PE header @ 0x{0:X}; signature 0x{1:X8}; machine 0x{2:X4}" -f $peOff, $peSig, $machine)
          if ($peSig -ne 0x00004550) { throw "not a PE file" }
          if ("${{ matrix.target }}" -match "aarch64") {
            if ($machine -ne 0xAA64) { throw ("expected ARM64 machine 0xAA64, got 0x{0:X4}" -f $machine) }
            Write-Host "OK: PE machine 0xAA64 = ARM64"
          } else {
            if ($machine -ne 0x8664) { throw ("expected x86_64 machine 0x8664, got 0x{0:X4}" -f $machine) }
            Write-Host "OK: PE machine 0x8664 = x86_64"
          }

      # ---- Stage + upload one uniquely-named binary per target ----
      # The file name is the ARTIFACT name (target-qualified) so the later
      # `merge-multiple` download never overwrites one binary with another
      # (two linux legs both build a file called `cachette`).
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          case "${{ matrix.bin }}" in *.exe) suffix=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}${suffix}"
          ls -l dist

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum * > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS
          echo "----------------------"
          # Exactly the 4 target binaries must be present.
          n="$(grep -c . SHA256SUMS)"
          if [ "$n" -ne 4 ]; then
            echo "::error::expected 4 binaries in SHA256SUMS, found $n"
            exit 1
          fi

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, checksums, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Release publish needs `contents: write` - granted via Authorized Integrations.
    steps:
      - name: Download every built binary + SHA256SUMS
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release and attach assets
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="$SERVER/api/v1/repos/$REPO"
          auth="Authorization: token $TOKEN"

          echo "Publishing $TAG ($SHA) to $api"
          ls -l dist

          # Create the release; a re-run returns "already exists", which we
          # tolerate by resolving the id from the tag anyway. `target_commitish`
          # pins the auto-created tag to the pushed commit (matters on the
          # `release` branch, where the tag is minted here rather than pushed).
          create_body="{\"tag_name\":\"$TAG\",\"name\":\"cachette $TAG\",\"target_commitish\":\"$SHA\",\"draft\":false,\"prerelease\":false}"
          curl -sS -X POST "$api/releases" \
            -H "$auth" -H 'Content-Type: application/json' \
            -d "$create_body" || true

          release_id=""
          for attempt in 1 2 3 4 5; do
            listing="$(curl -sS -H "$auth" "$api/releases/tags/$TAG" || true)"
            release_id="$(printf '%s' "$listing" | grep -o '"id":[0-9]\+' | head -n1 | cut -d: -f2 || true)"
            [ -n "$release_id" ] && break
            echo "release not resolvable yet (attempt $attempt); retrying"
            sleep 3
          done
          if [ -z "$release_id" ]; then
            echo "::error::could not resolve a release id for tag $TAG"
            exit 1
          fi
          echo "release id = $release_id"

          # Upload each asset (binaries + SHA256SUMS), retrying transient
          # failures. A re-run hits "already exists" (HTTP 400/409) for an asset
          # that is already attached; that is treated as success so a re-run of
          # the tag is idempotent.
          for f in dist/*; do
            name="$(basename "$f")"
            uploaded=false
            for attempt in 1 2 3 4; do
              code="$(curl -sS -o /tmp/upload.out -w '%{http_code}' \
                -X POST "$api/releases/$release_id/assets?name=$name" \
                -H "$auth" -F "attachment=@$f" || true)"
              if [ "$code" = "201" ] || [ "$code" = "200" ]; then
                echo "uploaded $name (HTTP $code)"
                uploaded=true
                break
              fi
              if [ "$code" = "400" ] || [ "$code" = "409" ]; then
                echo "asset $name already attached (HTTP $code); idempotent re-run"
                uploaded=true
                break
              fi
              echo "upload $name attempt $attempt -> HTTP $code; retrying"
              cat /tmp/upload.out || true
              sleep $((attempt * 3))
            done
            if [ "$uploaded" != "true" ]; then
              echo "::error::failed to upload $name after retries"
              exit 1
            fi
          done
          echo "OK: release $TAG published with all assets"
