# Release pipeline for cachette (plan task 53; supersedes the task-36/38 drafts):
#   cross-compiled binary matrix -> checksums -> release.
#
# The OCI image is NOT built here. regexYbot-shaped split: the docker image
# work (multi-arch build + registry publish on every ref that reaches a check
# - semver tags on `release`, the regexY dev scheme on other branches,
# `pr-<number>` on PRs) lives in push-checks.yml / pr-checks.yml, so the
# publish machinery is exercised by the ordinary checks - and a merge into
# `release` fires BOTH this pipeline (binaries + checksums + release) and
# push-checks.yml (the image) at the same time.
#
# Publishing follows the SAME contract as regexYbot's release.yml (the shape
# this whole pipeline was styled after):
#   * a `v*` tag push            -> always publishes under that tag
#   * a PR merged into `release` -> publishes under `v<Cargo.toml version>`
#     ONLY when the PR carries the `Release` label; the merged state and the
#     label list come straight from the pull_request[closed] event - no
#     subject parsing, no API re-verification. A label-less merge triggers
#     nothing (the version job logs why and every other job is skipped by
#     the publish flag).
#   * a manual workflow_dispatch -> ALWAYS publishes: `version` overrides the
#     manifest-derived version, `tag_name` overrides the derived
#     `v<version>` (both empty = plain Cargo.toml cut at the checkout the
#     dispatch resolves to). A dispatch is the explicit lever to cut or
#     re-cut a release; the publish step runs actions/forgejo-release with
#     override: true (regexY re-run semantics): the stale release of the
#     same tag is deleted and a sha-mismatched tag is re-minted at this
#     run's commit, so overrides cannot collide.
#   * the regexY flow also carries a `pr_number` input used by its PR-comment
#     step: NOT copied - cachette ships no changelog/PR-comment step.
#
# NOTE (Forgejo artifacts): actions/upload-artifact@v4 +
# download-artifact@v4 ship an @actions/artifact v2 client that hard-fails
# on any host other than github.com ("are not currently supported on
# GHES") - proven by the 1.0.0 cut run 69 where every leg died at its
# upload step only after the build succeeded (task 4605). Forgejo's
# patched forks keep the identical v4 action schema (incl.
# `merge-multiple`) minus that gate and speak the runtime backend this
# instance implements; the forge docs mandate exactly this substitution:
# https://forgejo.org/docs/v15.0/user/actions/advanced-features
#
# NOTE (Actions cache): all cargo caching below is plain actions/cache@v6,
# NOT Swatinem/rust-cache@v2 (the check workflows swapped too, same commit).
# Fleet reason: the runners' cache endpoint serves only the legacy v1
# artifactcache dialect (/_apis/artifactcache paths, HMAC headers), while the
# external cache server (acc.nixthedev.ru, falcondev
# github-actions-cache-server) speaks only Twirp cache-v2 with GitHub-OIDC
# auth - the two can never interoperate (full diagnosis in the repo-local,
# untracked handoff notes), so rust-cache's cache calls surface as permanent
# 401 noise: every restore misses, every save fails. The plain
# actions/cache@v6 steps in these very workflows (rustup toolchains,
# docker/buildx/compose pins) demonstrably cache on these same runners
# (runs #76/#77 stay green in minutes), so the cargo cache uses that exact
# action with manual keys and starts working with zero further edits the
# moment the cache pair speaks one protocol (fleet option A: the runner
# binary's own `cache-server` subcommand).
#
# =============================================================================
# TOOLCHAIN JUSTIFICATION (required by plan): cargo-zigbuild for the Linux legs
# =============================================================================
# Goal: fully STATIC `*-unknown-linux-musl` binaries that run on any Linux
# distro without glibc-version coupling. A musl build needs (a) musl libc,
# (b) a linker + C toolchain for the C code pulled in by dependencies
# (`rusqlite/bundled` compiles SQLite C; `ring` has C/asm; cc-rs in general):
#
#   * `x86_64-unknown-linux-musl` is a SELF-CONTAINED rustc target (rustup
#     ships its own libc.a) - it only needs a linker, so it would build with
#     nothing exotic. But:
#   * `aarch64-unknown-linux-musl` is Tier 2 WITHOUT host tools: rustup
#     installs std, but an x86_64 runner has no aarch64 musl libc/linker.
#     apt's `musl-tools` only covers the HOST arch; hand-rolling an aarch64
#     cross toolchain (cross-gcc + aarch64 musl libc) is the fragile setup the
#     plan explicitly asks us to avoid.
#   * `cargo-zigbuild` drives `zig cc` as the linker/C compiler for BOTH
#     targets: zig ships its own libc (including musl) and understands rustc's
#     target triples, so ONE toolchain covers x86_64 + aarch64 musl uniformly -
#     no QEMU, no system packages beyond `zig` itself.
#
# Why NOT `cross` (plan: must NOT add `cross` unless zigbuild fails):
#   `cross` pulls prebuilt Docker images (ghcr.io/cross-rs/*) and runs every
#   build inside a container - heavier (docker-in-CI per leg), slow cold
#   starts, and it would duplicate what zigbuild already does here. It stays
#   the documented fallback: if a future zig / cargo-zigbuild regression makes
#   the musl legs fail, replace the two `if: matrix.zigbuild == true` steps
#   with `cross build --target <triple> --release` and record the reason in
#   this comment (NOT silently in a follow-up commit).
#
# Windows legs are cross-built on Linux by cargo-zigbuild like everything else:
#   * x86_64-pc-windows-gnu is a Tier 2 rustup target; the arm64 leg targets
#     aarch64-pc-windows-gnullvm, NOT -pc-windows-gnu: official stable dist
#     no longer publishes `rust-std` for plain aarch64-pc-windows-gnu (the
#     original claim that both triples were Tier 2 was wrong - proven by the
#     first-ever release.yml run on a release merge where the arm64 leg
#     failed inside rustup toolchain setup, task 4604). gnullvm is the
#     Tier-2 ARM64 Windows target (LLVM-mingw/UCRT flavor): std ships,
#     cargo-zigbuild maps Environment::GnuLlvm onto zig's gnu userland
#     explicitly, and the binaries run on Windows 10/11 ARM64 (UCRT ships
#     with the OS). No Windows-native toolchain (no MSVC, no windows-latest
#     legs) is involved. A cross-built PE cannot execute on the Linux
#     runner, so the artifacts are verified structurally: the PE COFF
#     machine field must be 0x8664 (x86_64) or 0xAA64 (ARM64) - the exact
#     fact `file(1)` would report; a `file`-based check runs too whenever
#     `file` exists on the runner.
#
#     MSVC windows binaries were declined for the v1.0.0 cut (recorded
#     decision): `*-pc-windows-msvc` is unreachable through cargo-zigbuild -
#     `zig cc` covers only the GNU (mingw) PE ABI - so a real msvc cross
#     build means a SECOND toolchain: cargo-xwin (or xwin + lld-link),
#     LLVM clang-cl, and the ~1 GiB MSVC CRT / Windows SDK download from
#     Microsoft with its own cache step. The gnu binaries run fine on
#     Windows 10/11, so wiring unproven msvc legs days before the cut was
#     declined on purpose. If the need ever materializes (users whose
#     tooling insists on msvc linkage), add two msvc matrix legs driven by
#     `cargo xwin build --release --target <triple>` with `~/.xwin` cached,
#     and record the change HERE - this header is the toolchain contract,
#     not the commit log.
#
#     UPDATE (v1.1, 2026-10-25): the need materialized. The matrix now ships
#     8 targets - linux gnu+musl and windows gnu+msvc, each amd64+arm64 -
#     with every leg pinned to the runner labels matching its arch and libc
#     (musl legs: alpine-latest + linux-<arch> = node:24-alpine on the right
#     host; everything else: linux-<arch> = node:24-trixie on the matching
#     host) so no leg ISA-crosses. Driver per leg:
#       * linux legs   - NATIVE for both libc variants: musl legs build with
#                        node:24-alpine's own gcc after `apk add gcc musl-dev
#                        file` (the Dockerfile builder's exact recipe); gnu
#                        legs build with the host gcc/glibc under
#                        node:24-trixie. Plain `cargo build` everywhere -
#                        no zig for linux at all.
#       * windows gnu  - zigbuild as before (zig cc drives mingw-w64; the
#                        arm64 leg is gnullvm per the paragraph above; no
#                        windows machines exist to cross FROM)
#       * windows msvc - cargo-xwin per the recipe above (~1 GiB CRT/SDK
#                        cached at ~/.xwin per runner arch); clang/lld/cmake/
#                        nasm installed per leg
#     The scratch/musl OCI image decision stands unchanged.
#
# Local-dev limitation (recorded by task 36): the dev workstation has NO
# zig/cargo-zigbuild and only the x86_64-pc-windows-msvc rustup target
# installed, so the cross legs are CI-validated only; the YAML itself is
# gated locally with `actionlint` (0 errors).
#
# Smoke tests: the native linux-x86_64-musl artifact RUNs and asserts the
# Cargo.toml version on `--version`; the cross artifacts (aarch64-musl, the
# windows legs) cannot execute on the runner, so they are verified
# structurally instead - `file`(1)/`uname` on linux, the PE machine field
# asserted unconditionally on windows (`file` too whenever present).
#
# =============================================================================
# PUBLISHING (plan task 53): the forge release + its binaries. Binaries +
# SHA256SUMS are attached to the Forgejo release. The release tag is
# `v<version>`: a pushed `v*` tag publishes under itself (version = tag minus
# `v`); a Release-labeled merged PR publishes under Cargo.toml's
# `[package] version`; a manual dispatch publishes under `tag_name` or
# `v<version>` exactly as its inputs said. The image side of a release
# (bare-semver tags `1.0.0`/`1.0`/`1` + `latest` + `release` at
# `hangar.nixthedev.ru/<owner>/cachette`) is pushed by push-checks.yml's docker
# job on the same merge. Other branches meanwhile publish regexY's dev scheme,
# so `latest` tracks dev heads until the next release push re-points it.
# =============================================================================
name: Release

on:
  pull_request:
    types: [closed]
    branches: [release]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut (e.g. 1.0.0). Empty = Cargo.toml at the resolved checkout."
        required: false
        type: string
      tag_name:
        description: "Git tag to publish (e.g. v1.0.0). Empty = v<version>."
        required: false
        type: string

# NOTE (Forgejo): a `permissions:` key is NOT supported - the instance logs
# "Job ... has a permissions field, which is not supported in Forgejo and will
# be ignored. Use Authorized Integrations ...". Registry/release capabilities
# come from the forge's Authorized Integrations, so none is declared here.

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve the version and whether this run publishes. Publishing refs:
  #   * a `v*` tag                          -> version = the tag sans its `v`
  #   * a PR merged into `release`          -> the Cargo.toml `[package] version`
  #                                            gated on the `Release` label
  #                                            from the event context
  #   * a manual dispatch                   -> inputs.version/tag_name or the
  #                                            Cargo.toml version; publish=true
  # Every other case builds nothing (skipped downstream jobs) and logs why.
  #
  # NOTE (runner bug, proven on the v1.0.0 cut): Forgejo runner v13.2.1 leaves
  # a `${{ inputs.* }}` expression unexpanded in job-level env when a
  # workflow_dispatch carries an empty inputs payload - run 44 handed the
  # publish step the literal tag `v${{ inputs.version }}`. The inputs are
  # therefore read through github.event.inputs (the payload-backed context)
  # AND sanitized in the script: a value that still contains `${{`/`}}` is
  # treated as "no input" so the Cargo.toml fallback wins, and the resolved
  # version/tag are rejected if a template literal or whitespace survives.
  version:
    name: resolve version
    runs-on: ubuntu-latest
    env:
      EVENT_MERGED: ${{ github.event.pull_request.merged }}
      EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      INPUT_VERSION: ${{ github.event.inputs.version }}
      INPUT_TAG: ${{ github.event.inputs.tag_name }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Resolve version and publish flag
        id: v
        shell: bash
        run: |
          set -euo pipefail

          # Runner v13.2.1 can leave an unexpanded template marker in job env
          # on an input-less workflow_dispatch (run 44: INPUT_VERSION came
          # through literally as a dollar sign followed by a double brace).
          # A templated value means "no input" - drop it so the Cargo.toml
          # fallback below wins. The marker is assembled at runtime so this
          # script never contains a literal expression opener that the
          # workflow preprocessor would try to evaluate.
          template_open='$'"{{"
          template_close='}}'
          sanitize_input() {
            local value="${1:-}"
            case "$value" in
              *"$template_open"*|*"$template_close"*)
                echo "WARNING: ignoring unexpanded dispatch input literal [$value]" >&2
                printf ''
                ;;
              *)
                printf '%s' "$value"
                ;;
            esac
          }
          INPUT_VERSION="$(sanitize_input "${INPUT_VERSION:-}")"
          INPUT_TAG="$(sanitize_input "${INPUT_TAG:-}")"

          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            # pull_request[closed] on release: the event carries merged state
            # and the label list natively (regexY contract) - nothing to
            # re-verify through the API.
            if [[ "$EVENT_MERGED" == "true" ]] \
              && printf '%s' "$EVENT_LABELS" | grep -q '"Release"'; then
              publish=true
              echo "merged PR carries the Release label: publishing"
            else
              publish=false
              echo "PR closed without merge+Release-label (merged=$EVENT_MERGED labels=$EVENT_LABELS): not publishing"
            fi
            version="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml \
              | sed -E 's/[^"]*"([^"]*)".*/\1/')"
            tag="v$version"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
            publish=true
          elif [[ "${GITHUB_REF}" == refs/heads/release ]]; then
            # Manual dispatch default context is the default branch (release):
            # the explicit cut/re-cut lever.
            publish=true
            version="$INPUT_VERSION"
            if [[ -z "$version" ]]; then
              version="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml \
                | sed -E 's/[^"]*"([^"]*)".*/\1/')"
            fi
            tag="$INPUT_TAG"
            if [[ -z "$tag" ]]; then
              tag="v$version"
            fi
            echo "manual dispatch on release: publishing $tag (version $version)"
          else
            version="0.0.0-${GITHUB_SHA:0:12}"
            tag="v$version"
            publish=false
            echo "unsupported ref $GITHUB_REF: not publishing"
          fi
          if [[ -z "$version" ]]; then
            echo "::error::could not resolve a version"
            exit 1
          fi
          # Last line of defense: a version/tag carrying an unexpanded
          # template literal or whitespace must never be minted as a release
          # tag (the v1.0.0 run 44 failure mode).
          if [[ "$version" == *"$template_open"* || "$version" == *"$template_close"* \
            || "$version" =~ [[:space:]] ]]; then
            echo "::error::refusing a suspicious version [$version] (unexpanded dispatch input?)"
            exit 1
          fi
          if [[ "$tag" == *"$template_open"* || "$tag" == *"$template_close"* \
            || "$tag" =~ [[:space:]] ]]; then
            echo "::error::refusing a suspicious tag [$tag] (unexpanded dispatch input?)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_REF} version=$version tag=$tag publish=$publish"

  # Build/checksums/release are skipped unless this run actually publishes.
  build:
    # Matrix legs interpolate their target into the display name (the
    # dispatcher shows them as "build (x86_64-unknown-linux-musl)", not
    # the anonymous build-1..build-7 column the v0.0.9-try dispatch ran);
    # the job id stays `build` for all needs:/outputs wiring.
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [version]
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        # runner label semantics: linux-<arch> maps to node:24-trixie on the
        # matching host arch; alpine-latest maps to node:24-alpine on WHATEVER
        # host answers (all runners carry it, arch unknown) - so the musl legs
        # pair alpine-latest WITH their arch label to pin libc AND arch.
        include:
          - runner: [alpine-latest, linux-amd64]
            userland: alpine
            target: x86_64-unknown-linux-musl
            driver: native
            artifact: cachette-x86_64-unknown-linux-musl
            bin: cachette
            smoke: run
          - runner: [alpine-latest, linux-arm64]
            userland: alpine
            target: aarch64-unknown-linux-musl
            driver: native
            artifact: cachette-aarch64-unknown-linux-musl
            bin: cachette
            smoke: cross-linux
          - runner: linux-amd64
            userland: debian
            target: x86_64-unknown-linux-gnu
            driver: native
            artifact: cachette-x86_64-unknown-linux-gnu
            bin: cachette
            smoke: run
          - runner: linux-arm64
            userland: debian
            target: aarch64-unknown-linux-gnu
            driver: native
            artifact: cachette-aarch64-unknown-linux-gnu
            bin: cachette
            smoke: cross-linux-gnu
          - runner: linux-amd64
            target: x86_64-pc-windows-gnu
            driver: zig
            artifact: cachette-x86_64-pc-windows-gnu
            bin: cachette.exe
            smoke: cross-windows
          - runner: linux-arm64
            target: aarch64-pc-windows-gnullvm
            driver: zig
            artifact: cachette-aarch64-pc-windows-gnullvm
            bin: cachette.exe
            smoke: cross-windows
          - runner: linux-amd64
            target: x86_64-pc-windows-msvc
            driver: xwin
            artifact: cachette-x86_64-pc-windows-msvc
            bin: cachette.exe
            smoke: cross-windows
          - runner: linux-arm64
            target: aarch64-pc-windows-msvc
            driver: xwin
            artifact: cachette-aarch64-pc-windows-msvc
            bin: cachette.exe
            smoke: cross-windows
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Install pinned Rust (1.99)
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
          targets: ${{ matrix.target }}

      # Cache the per-target toolchain + std libs (the slow rustup leg on these
      # runners); matrix.target keeps the different std libraries apart, and
      # dtolnay's `cachekey` output pins the exact toolchain version
      # (pinned: 1.99, the version the battery + docker base validate).
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-${{ matrix.target }}-${{ steps.toolchain.outputs.cachekey }}

      - name: Cache cargo registry/build
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE at the top of this file. Cross artifacts live under
        # target/<triple>, so the scope is the matrix target, pinned on
        # dtolnay's rust `cachekey` (the toolchain/stdlib behind the build)
        # and the Cargo.lock hash, with a restore-keys fallback for lockfile
        # drift; cargo re-fingerprints whatever else drifted.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-${{ steps.toolchain.outputs.cachekey }}-

      # ---- zig driver legs (windows gnu/gnullvm only) ----
      # zig cc (behind cargo-zigbuild) is the only zig usage in these legs,
      # so the install is hand-rolled and RESUMABLE by design: the action
      # fetch (mlugg/setup-zig@v2) died mid-tarball on BOTH of its routes
      # (task 409 default vault; task 461 the machengine-mirror primary
      # AND the vault retry) with undici's ::error::terminated at ~72s -
      # a ~50MB response body never survives a pass through these
      # runners' egress whole. curl --retry-all-errors + -C - turns every
      # cut into a Range resume instead of a failure, and the outer round
      # ladder caps the fight. The completed tarball is sha256-verified
      # against the pinned values (read off ziglang.org's
      # download/index.json), extracted into the tool cache and published
      # on PATH (the same mechanism setup-zig used); a matching install on
      # a warm runner short-circuits the fetch. setup-zig's global zig
      # package-cache blob belongs to `zig build`, which these legs never
      # run - nothing else is lost. Version PINNED: a bump means changing
      # the version + BOTH shasums together (and re-watching the
      # cargo-zigbuild contract; see the TOOLCHAIN JUSTIFICATION header
      # notes).
      - name: Install zig (resumable pinned fetch)
        if: matrix.driver == 'zig'
        shell: bash
        run: |
          set -euo pipefail
          version="0.14.1"
          case "$(uname -m)" in
            x86_64)  pkg="x86_64-linux";  sha="24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c";;
            aarch64) pkg="aarch64-linux"; sha="f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b";;
            *) echo "::error::unsupported zig host arch: $(uname -m)"; exit 1 ;;
          esac
          cache_root="${RUNNER_TOOL_CACHE:-${HOME}/.cache/cachette-toolcache}"
          dir="${cache_root}/zig-${version}"
          tmp="${RUNNER_TEMP:-/tmp}/zig-${pkg}-${version}.tar.xz"
          if [ -x "${dir}/zig" ]; then
            echo "OK: reusing the cached zig tree at ${dir}"
          else
            url="https://ziglang.org/download/${version}/zig-${pkg}-${version}.tar.xz"
            rm -f "${tmp}"
            round=1
            while ! curl -fSL --connect-timeout 20 --retry 8 --retry-all-errors --retry-delay 2 -C - -o "${tmp}" "${url}"; do
              round=$((round + 1))
              if [ "${round}" -gt 4 ]; then
                echo "::error::the zig tarball never completed (4 outer rounds of 8 resumable retries each)"
                exit 1
              fi
              echo "zig tarball round ${round}: resuming the fetch"
              sleep 3
            done
            echo "${sha}  ${tmp}" | sha256sum -c -
            rm -rf "${dir}"
            mkdir -p "${dir}"
            tar -xJf "${tmp}" -C "${dir}" --strip-components=1
            echo "OK: extracted the sha256-verified zig tree to ${dir}"
          fi
          "${dir}/zig" version
          echo "${dir}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        if: matrix.driver == 'zig'
        run: cargo install cargo-zigbuild --locked

      - name: Build
        if: matrix.driver == 'zig'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      # ---- native driver legs (linux): plain cargo, host toolchain ----
      - name: Install musl build prerequisites
        if: matrix.driver == 'native' && matrix.userland == 'alpine'
        # The Dockerfile builder's exact recipe: gcc + musl-dev for the C
        # deps (sqlite3.c, ring), file(1) for the smoke assertions.
        run: apk add --no-cache gcc musl-dev file

      - name: Install glibc build prerequisites
        if: matrix.driver == 'native' && matrix.userland == 'debian'
        run: |
          set -euo pipefail
          for tool in gcc file; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends "$tool"
            fi
          done
          gcc --version | head -n1

      - name: Build
        if: matrix.driver == 'native'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ---- xwin driver legs (windows msvc): cargo-xwin, header's recipe ----
      - name: Install msvc cross prerequisites
        if: matrix.driver == 'xwin'
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends clang llvm lld cmake nasm

      # ~1 GiB CRT/SDK; cache per runner arch + recipe version so content
      # bumps (xwin updates changing the SDK layout) are done as v1 -> v2
      # in this file.
      - name: Cache xwin CRT/SDK
        if: matrix.driver == 'xwin'
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.xwin
          key: xwin-v1-${{ runner.arch }}

      - name: Install cargo-xwin
        if: matrix.driver == 'xwin'
        run: cargo install cargo-xwin --locked

      - name: Build
        if: matrix.driver == 'xwin'
        run: cargo xwin build --release --locked --target ${{ matrix.target }}

      # ---- Smoke: native artifacts actually RUN --version ----
      - name: Smoke - run native binary --version
        if: matrix.smoke == 'run'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$bin" || true
          command -v file >/dev/null 2>&1 && file "$bin"
          got="$("$bin" --version | tr -d '\r')"
          # Version from the manifest, not hardcoded - survives every cut.
          want="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml \
            | sed -E 's/[^"]*"([^"]*)".*/\1/')"
          echo "cachette --version => [$got] (want [cachette $want])"
          if [ "$got" != "cachette $want" ]; then
            echo "::error::expected exactly 'cachette $want', got '$got'"
            exit 1
          fi

      # ---- Smoke: cross Linux artifact (file/uname - cannot execute) ----
      - name: Smoke - cross linux artifact
        if: matrix.smoke == 'cross-linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$bin"
          echo "uname -m (host arch): $(uname -m)"
          test "$(uname -m)" = "aarch64"
          echo "file(1) output:"
          file "$bin"
          file "$bin" | grep -qi "aarch64"
          file "$bin" | grep -Eq "statically linked|static-pie linked"
          echo "OK: aarch64 musl STATIC artifact, built natively on the arm64 runner"

      # ---- Smoke: linux gnu aarch64 artifact (file: arch + DYNAMICALLY
      # linked against glibc - static would prove the wrong triple built) ----
      - name: Smoke - cross linux gnu artifact
        if: matrix.smoke == 'cross-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          chmod +x "$bin"
          echo "uname -m (host arch): $(uname -m)"
          test "$(uname -m)" = "aarch64"
          echo "file(1) output:"
          file "$bin"
          file "$bin" | grep -qi "aarch64"
          file "$bin" | grep -Eqi "interpreter|dynamically linked"
          if file "$bin" | grep -Eqi "statically linked|static-pie linked"; then
            echo "::error::aarch64 gnu artifact unexpectedly static"
            exit 1
          fi
          echo "OK: aarch64 glibc-linked ELF (gnu triple proven)"

      # ---- Smoke: cross Windows artifact ----
      # file(1) may be absent from the runner's Git Bash - print its output
      # when present. NO grep on `file`'s wording here: the version string
      # for the AMD64 build says `x86-64`, not a keyword any arm64 grep
      # would match, and relying on it therefore failed the x86_64 leg
      # silently-turned-red (task 162). The assertion lives verbatim in the
      # PE machine step below, which runs unconditionally and reads the
      # COFF machine field per target - strictly stronger than any `file`
      # wording.
      - name: Smoke - cross windows artifact file
        if: matrix.smoke == 'cross-windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if command -v file >/dev/null 2>&1; then
            echo "file(1) output:"
            file "$bin"
          else
            echo "file(1) not on this runner - PE machine asserted in the next step"
          fi

      - name: Smoke - cross windows artifact PE machine
        if: matrix.smoke == 'cross-windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ ! -s "$bin" ]; then
            echo "::error::artifact missing or empty: $bin"
            exit 1
          fi
          # PE COFF machine field, read straight from the file with coreutils
          # od (on every Linux runner - pwsh is absent from the act-runner
          # image and 127ed the v1.0.0 dispatch's task 64): e_lfanew (u32 LE)
          # at 0x3C points at the PE header, "PE\0\0" signature there, and
          # the machine field (u16 LE) directly behind it. Decimal compare:
          # 0x4550 = 17744, 0xAA64 = 43620, 0x8664 = 34404.
          pe_off="$(od -An -tu4 -j 60 -N 4 --endian=little "$bin" | tr -d ' \n')"
          pe_sig="$(od -An -tu4 -j "$pe_off" -N 4 --endian=little "$bin" | tr -d ' \n')"
          machine="$(od -An -tu2 -j $((pe_off + 4)) -N 2 --endian=little "$bin" | tr -d ' \n')"
          printf 'PE header @ 0x%X; signature 0x%08X; machine 0x%04X\n' "$pe_off" "$pe_sig" "$machine"
          if [ "$pe_sig" -ne 17744 ]; then
            echo "::error::not a PE file (signature 0x$(printf '%08X' "$pe_sig"))"
            exit 1
          fi
          case "${{ matrix.target }}" in
            *aarch64*)
              if [ "$machine" -ne 43620 ]; then
                echo "::error::expected ARM64 machine 0xAA64, got 0x$(printf '%04X' "$machine")"
                exit 1
              fi
              echo "OK: PE machine 0xAA64 = ARM64"
              ;;
            *)
              if [ "$machine" -ne 34404 ]; then
                echo "::error::expected x86_64 machine 0x8664, got 0x$(printf '%04X' "$machine")"
                exit 1
              fi
              echo "OK: PE machine 0x8664 = x86_64"
              ;;
          esac

      # ---- Stage + upload one uniquely-named binary per target ----
      # The file name is the ARTIFACT name (target-qualified) so the later
      # `merge-multiple` download never overwrites one binary with another
      # (two linux legs both build a file called `cachette`).
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          case "${{ matrix.bin }}" in *.exe) suffix=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}${suffix}"
          ls -l dist

      - name: Upload binary artifact
        uses: https://hangar.nixthedev.ru/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [build, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: https://hangar.nixthedev.ru/forgejo/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum * > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS
          echo "----------------------"
          # Exactly the 8 target binaries must be present.
          n="$(grep -c . SHA256SUMS)"
          if [ "$n" -ne 8 ]; then
            echo "::error::expected 8 binaries in SHA256SUMS, found $n"
            exit 1
          fi

      - name: Upload SHA256SUMS
        uses: https://hangar.nixthedev.ru/forgejo/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, checksums, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Release publish needs `contents: write` - granted via Authorized Integrations.
    steps:
      - name: Download every built binary + SHA256SUMS
        uses: https://hangar.nixthedev.ru/forgejo/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release and attach assets
        # actions/forgejo-release (official), pinned to v2.13.4 on the
        # instance's own mirror - the same egress-immune pattern as the
        # actions/checkout@v4 references. Every input is passed explicitly so
        # the action's forge.* context defaults never have to evaluate.
        # override: true is the regexY re-run contract, and the action keeps
        # it step for step: the stale release of the same tag is deleted, a
        # sha-mismatched tag is deleted and re-minted at this run's commit,
        # and the release is created as a draft that only un-drafts after
        # every asset is attached - a failed upload cannot leave a
        # half-populated public release.
        uses: https://hangar.nixthedev.ru/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ needs.version.outputs.tag }}
          sha: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "cachette ${{ needs.version.outputs.tag }}"
          release-dir: dist
          override: true
          verbose: true
