# PR gate for cachette (was ci.yml; the push twin is push-checks.yml).
# Same five jobs, same budgets, same semantics - split out only so that a
# pull-request run and a push run no longer auto-cancel each other, and so
# the two triggers read independently.
#
# The docker job here is always the VALIDATION leg (amd64 --load, nothing
# leaves the runner); the registry publish lives in push-checks.yml on the
# `release` branch. Both legs exercise the cachette buildkit layer cache
# (docker buildx `type=gha` -> acc.nixthedev.ru; `CACHETTE_BUILDX_JWT` static
# bearer, minted per docs/clients.md; unset secret = cache misses, still green).
#
# See push-checks.yml for the per-job notes (rust-cache, real-client toolchain
# requirements, apt retry on deb.debian.org, tag scheme).
name: PR Checks

on:
  pull_request:
    branches: [release]

# Operates on the PR's own head branches; distinct group name so PR invocations
# are only superseded by newer PR invocations, not by push-checks runs.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust (rustfmt)
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: rustfmt --check
        run: cargo fmt --all -- --check

  check:
    name: check (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust (clippy)
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (all suites)
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install Node.js (for the @actions/cache toolkit fixture)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Go (for the go-actions-cache fixture)
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Assert real-client toolchains are present (fail, never skip)
        run: |
          set -euo pipefail
          node --version
          npm --version
          go version
      - name: cargo test (entire workspace)
        run: cargo test --workspace --locked

  docs:
    name: docs (example config + compose)
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Validate the embedded example config (--print-config)
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --config cachette.example.toml --print-config > /dev/null
          echo "OK: cachette.example.toml resolves"
      - name: Install docker CLI + compose (retry)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "== apt attempt $attempt =="
            if apt-get update && apt-get install -y --no-install-recommends docker-cli docker-compose; then
              docker --version
              docker compose version
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::apt install failed after 3 attempts"
          exit 1
      - name: Validate compose.yaml
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config > /dev/null
          echo "OK: compose.yaml parses"

  # ---------------------------------------------------------------------------
  # Docker VALIDATION path - identical recipes to push-checks.yml's docker job
  # minus the registry login/push/manifest-verify legs. On a PR this is the
  # first-ever run of the cachette docker path, so it doubles as the release
  # rehearsal: QEMU + buildx + the cachette-backed layer cache all run here.
  # ---------------------------------------------------------------------------
  docker:
    name: docker (validation build)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CACHE_ARGS: >-
        --cache-from type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
        --cache-to type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Install docker CLI (static tarball, retried)
        run: |
          set -euo pipefail
          url="https://download.docker.com/linux/static/stable/$(uname -m)/docker-28.0.4.tgz"
          for attempt in 1 2 3; do
            echo "== docker download attempt $attempt =="
            if curl -fsSL "$url" | tar xz -C /usr/local/bin --strip-components=1 docker/docker; then
              docker --version
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install the docker CLI after 3 attempts"
          exit 1

      - name: Set up QEMU (arm64 builder stage emulation)
        uses: https://hangar.nixthedev.ru/docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: https://hangar.nixthedev.ru/docker/setup-buildx-action@v3

      - name: Compute image ref + docker tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          echo "TAGFLAGS=--tag cachette:ci-dryrun" >> "$GITHUB_ENV"
          echo "TAGFLAGS updated"

      - name: Validation build (amd64 --load)
        if: github.ref != 'refs/heads/release'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 ${TAGFLAGS} ${CACHE_ARGS} .
          got="$(docker run --rm cachette:ci-dryrun --version)"
          echo "cachette --version => [$got]"
          [ "$got" = "cachette 0.1.0" ]
