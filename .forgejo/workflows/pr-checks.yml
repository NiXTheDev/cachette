# PR gate for cachette (was ci.yml; the push twin is push-checks.yml).
# Same five jobs, same budgets, same semantics - split out only so that a
# pull-request run and a push run no longer auto-cancel each other, and so
# the two triggers read independently.
#
# The docker job here pushes the PR head image: a local --load build first
# (amd64, with the binary `--version` assert), then a real publish multi-arch
# on the flyweight `pr-<PR number>` tag. Both legs exercise the cachette
# buildkit layer cache
# (docker buildx `type=gha` -> acc.nixthedev.ru; `CACHETTE_BUILDX_JWT` static
# bearer, minted per docs/clients.md; a missing/malformed/expired token is
# RED at exporter configure time, not a mere cache miss).
#
# See push-checks.yml for the per-job notes (rust-cache, real-client toolchain
# requirements, the static docker-compose install, tag scheme).
name: PR Checks

on:
  pull_request:
    branches: [release]

# Operates on the PR's own head branches; distinct group name so PR invocations
# are only superseded by newer PR invocations, not by push-checks runs.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install rustfmt toolchain
        id: toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: cachette-rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: rustfmt --check
        run: cargo fmt --all -- --check

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        id: toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: cachette-rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install clippy toolchain
        id: toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: cachette-rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        id: toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: cachette-rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Built-in restore-at-start/store-at-end of the npm tarballs via the
          # toolkit; the fixture's `npm ci` then makes no registry fetches.
          cache: "npm"
          cache-dependency-path: tests/fixtures/package-lock.json
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # Both setup steps above cache through the toolkit natively
      # (restore-at-start / store-at-end): node caches the npm tarballs, go caches
      # ~/.cache/go-build + ~/go/pkg/mod by default - so the vendored fixture
      # builds below don't refetch/recompile from zero each run.
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Assert real-client toolchains are present
        run: |
          set -euo pipefail
          node --version
          npm --version
          go version
      - name: cargo test
        run: cargo test --workspace --locked

  docs:
    name: docs
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        id: toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: cachette-rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        uses: https://github.com/Swatinem/rust-cache@v2
      - name: Validate the embedded example config
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --config cachette.example.toml --print-config > /dev/null
          echo "OK: cachette.example.toml resolves"
      # Same reasoning as push-checks.yml: `docker-compose config` is file-only
      # validation, so this job fetches the pinned docker/compose standalone
      # release binary and avoids apt / deb.debian.org entirely (the mirror was
      # the flake that failed this job on #31 attempt 1).
      - name: Cache the pinned docker-compose binary
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/docker-compose
          key: cachette-docker-compose-5.6.0-linux-amd64
      - name: Install compose
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - skip the download.
          if docker-compose --version 2>/dev/null | grep -q 'v5.6.0'; then
            echo "docker-compose already present (cachette hit): $(docker-compose --version)"
            exit 0
          fi
          url="https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64"
          for attempt in 1 2 3; do
            echo "== docker-compose download attempt $attempt =="
            if curl -fsSL --retry 3 --connect-timeout 20 "$url" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose; then
              docker-compose --version
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install docker-compose after 3 attempts"
          exit 1
      - name: Validate compose.yaml
        run: |
          set -euo pipefail
          docker-compose -f compose.yaml config > /dev/null
          echo "OK: compose.yaml parses"

  # ---------------------------------------------------------------------------
  # Docker path on PRs - the same recipes as push-checks.yml's docker job
  # (QEMU + buildx + the cachette-backed layer cache, plus registry login,
  # push and manifest verification): every PR publishes its flyweight
  # `pr-<number>` head image after the --load validation proves the binary.
  # ---------------------------------------------------------------------------
  docker:
    name: docker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CACHE_ARGS: >-
        --cache-from type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
        --cache-to type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Cache the pinned docker CLI
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/docker
          key: cachette-docker-cli-28.0.4-linux-amd64

      - name: Install docker CLI
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - skip the download.
          if docker --version 2>/dev/null | grep -q '28.0.4'; then
            echo "docker CLI already present (cachette hit): $(docker --version)"
            exit 0
          fi
          url="https://download.docker.com/linux/static/stable/$(uname -m)/docker-28.0.4.tgz"
          for attempt in 1 2 3; do
            echo "== docker download attempt $attempt =="
            if curl -fsSL "$url" | tar xz -C /usr/local/bin --strip-components=1 docker/docker; then
              docker --version
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install the docker CLI after 3 attempts"
          exit 1

      - name: Set up QEMU
        uses: https://hangar.nixthedev.ru/docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: https://hangar.nixthedev.ru/docker/setup-buildx-action@v3

      # Account-wide registry token (the same credentials regexYbot's pipelines
      # use): the default GITHUB_TOKEN has no registry write on Forgejo.
      - name: Log in to the forge registry
        uses: https://hangar.nixthedev.ru/docker/login-action@v3
        with:
          registry: hangar.nixthedev.ru
          username: ${{ github.repository_owner }}
          password: ${{ secrets.HGPR_TOKEN }}

      # PR flyweight tag: `pr-<number>` parsed from refs/pull/<number>/merge.
      # TAGFLAGS is what the push step publishes; LOCALFLAGS is the throwaway
      # local tag for the --load validation + --version assert.
      - name: Compute image ref + docker tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="hangar.nixthedev.ru/${owner}/cachette"
          pr="${GITHUB_REF#refs/pull/}"
          pr="${pr%/merge}"
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "verify_ref=${image}:pr-${pr}" >> "$GITHUB_OUTPUT"
          echo "TAGFLAGS=--tag ${image}:pr-${pr}" >> "$GITHUB_ENV"
          echo "LOCALFLAGS=--tag cachette:ci-dryrun" >> "$GITHUB_ENV"
          echo "TAGFLAGS=--tag ${image}:pr-${pr}"

      - name: Validation build
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 ${LOCALFLAGS} ${CACHE_ARGS} .
          got="$(docker run --rm cachette:ci-dryrun --version)"
          echo "cachette --version => [$got]"
          [ "$got" = "cachette 1.0.0" ]

      # PR flyweight image: multi-arch (linux/amd64 + linux/arm64), same recipe
      # and retries as push-checks.yml. The validation build above seeded the
      # layer cache, so this second pass is nearly free.
      - name: Build + push PR image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.tags.outputs.image }}"
          for attempt in 1 2 3 4; do
            echo "== buildx push attempt $attempt =="
            if docker buildx build \
                 --platform linux/amd64,linux/arm64 \
                 ${TAGFLAGS} \
                 ${CACHE_ARGS} \
                 --push \
                 .; then
              echo "OK: pushed ${image}:pr-${{ steps.tags.outputs.pr }}"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::multi-arch PR image push failed after 4 attempts"
          exit 1

      # Acceptance: the pushed pr-N tag must be a manifest list covering BOTH
      # architectures.
      - name: Verify manifest lists amd64 AND arm64
        run: |
          set -euo pipefail
          ref="${{ steps.tags.outputs.verify_ref }}"
          manifest="$(docker manifest inspect "$ref")"
          echo "$manifest"
          echo "$manifest" | grep -q '"architecture": "amd64"'
          echo "$manifest" | grep -q '"architecture": "arm64"'
          echo "OK: $ref is a manifest list with amd64 + arm64"
