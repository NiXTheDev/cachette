# PR gate for cachette (was ci.yml; the push twin is push-checks.yml).
# Same five jobs, same semantics - split out only so that a
# pull-request run and a push run no longer auto-cancel each other, and so
# the two triggers read independently.
#
# The docker job here publishes the PR head image multi-arch on the
# flyweight `pr-<PR number>` tag and asserts the result is a dual-arch
# manifest list. (The boot-check here is notice-only: PR head images are
# allowed to be broken; only a release-branch push gates red on it.) Every
# build reads AND
# writes the buildkit layer cache via the cachette-served gha cache
# (`type=gha` -> acc.nixthedev.ru; `CACHETTE_BUILDX_JWT` static bearer,
# minted per docs/clients.md; ignore-error=true), and the persistent host
# buildkit inside the warm dockerd is the second cache layer by itself.
# The machinery is the docker.org action family (setup-qemu, login-action,
# setup-buildx, build-push-action); there is no registry buildcache and no
# on-disk cache snapshot.
#
# See push-checks.yml for the per-job notes (cargo cache, real-client toolchain
# requirements, the static docker-compose install, tag scheme).
name: PR Checks

on:
  pull_request:
    branches: [release]

# Operates on the PR's own head branches; distinct group name so PR invocations
# are only superseded by newer PR invocations, not by push-checks runs.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      # Egress-proof the toolchain fetch - the mirror ladder lives in
      # .forgejo/actions/rustup-mirror (see its header for the why).
      - name: Bootstrap rustup through the mirror ladder
        uses: ./.forgejo/actions/rustup-mirror
      - name: Install rustfmt toolchain
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100
          components: rustfmt
      # The component fetch is its own network leg and rustup carries no
      # ladder of its own (run 5's fmt died in 14s when the toolchain host
      # EOF'd mid-`rustup component add`, and 992ba8e's fmt/check/clippy legs
      # relapsed the same class). The bootstrap step above now points
      # rustup at a mirror ladder for the TOOLCHAIN fetch; the component
      # fetch rides that same mirror, and `rustup component add` no-ops in
      # ~1s when the component is already in place, so the common path pays
      # nothing; a poisoned/rejected fetch gets three retries with backoff
      # and a loud tool-level error instead of a bare rustup wall.
      - name: Ensure the components landed (retry ladder)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if rustup component add rustfmt; then
              cargo fmt --version
              exit 0
            fi
            echo "component add attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::rustfmt was not fetched after 4 attempts"
          exit 1
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.100, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.100-${{ runner.arch }}
      # No cargo cache here on purpose: `cargo fmt` builds nothing, so a
      # registry/target cache would churn bytes for nothing (cache rationale
      # lives in the NOTE (Actions cache) block of release.yml's header).
      - name: rustfmt --check
        run: cargo fmt --all -- --check

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      # Egress-proof the toolchain fetch - the mirror ladder lives in
      # .forgejo/actions/rustup-mirror (see its header for the why).
      - name: Bootstrap rustup through the mirror ladder
        uses: ./.forgejo/actions/rustup-mirror
      - name: Install pinned Rust (1.100)
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.100, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.100-${{ runner.arch }}
      - name: Cache cargo registry
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header. This key is IDENTICAL in push-checks
        # and release.yml, so the registry/git store is shared across all
        # workflows on the same arch/toolchain/lockfile.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-1.100-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-1.100-${{ runner.arch }}-
      - name: Cache cargo target
        # Host-target artifacts only; shared by the check jobs, never with
        # release's cross-target legs.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: target
          key: cargo-target-checks-1.100-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-checks-1.100-${{ runner.arch }}-
      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      # Egress-proof the toolchain fetch - the mirror ladder lives in
      # .forgejo/actions/rustup-mirror (see its header for the why).
      - name: Bootstrap rustup through the mirror ladder
        uses: ./.forgejo/actions/rustup-mirror
      - name: Install clippy toolchain
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100
          components: clippy
      # Same component-fetch ladder as the fmt job (docs above).
      - name: Ensure the components landed (retry ladder)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if rustup component add clippy; then
              cargo clippy --version
              exit 0
            fi
            echo "component add attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::clippy was not fetched after 4 attempts"
          exit 1
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.100, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.100-${{ runner.arch }}
      - name: Cache cargo registry
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header. This key is IDENTICAL in push-checks
        # and release.yml, so the registry/git store is shared across all
        # workflows on the same arch/toolchain/lockfile.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-1.100-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-1.100-${{ runner.arch }}-
      - name: Cache cargo target
        # Host-target artifacts only; shared by the check jobs, never with
        # release's cross-target legs.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: target
          key: cargo-target-checks-1.100-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-checks-1.100-${{ runner.arch }}-
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      # Egress-proof the toolchain fetch - the mirror ladder lives in
      # .forgejo/actions/rustup-mirror (see its header for the why).
      - name: Bootstrap rustup through the mirror ladder
        uses: ./.forgejo/actions/rustup-mirror
      - name: Install pinned Rust (1.100)
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.100, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.100-${{ runner.arch }}
      # node/npm ship in the runner images themselves (act-runner's
      # ubuntu-latest image on amd64, node:24-trixie on arm64), so there is
      # nothing to install - the assert below fails loudly if that ever
      # stops being true. The npm tarball caching that setup-node used to
      # provide moves to plain actions/cache: same key shape (lock hash),
      # same ~/.npm path.
      - name: Cache npm tarballs
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('tests/fixtures/package-lock.json') }}-${{ runner.arch }}
      # go is NOT in the arm64 image (node:24-trixie), so the pin stays
      # explicit here on all arches. setup-go caches ~/.cache/go-build +
      # ~/go/pkg/mod natively (restore-at-start / store-at-end), so the
      # vendored fixture builds below don't refetch/recompile from zero
      # each run.
      - name: Install Go
        uses: https://hangar.nixthedev.ru/actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cache cargo registry
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header. This key is IDENTICAL in push-checks
        # and release.yml, so the registry/git store is shared across all
        # workflows on the same arch/toolchain/lockfile.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-1.100-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-1.100-${{ runner.arch }}-
      - name: Cache cargo target
        # Host-target artifacts only; shared by the check jobs, never with
        # release's cross-target legs.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: target
          key: cargo-target-checks-1.100-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-checks-1.100-${{ runner.arch }}-
      - name: Assert real-client toolchains are present
        run: |
          set -euo pipefail
          node --version
          npm --version
          go version
      - name: cargo test
        run: cargo test --workspace --locked

  docs:
    name: docs
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      # Egress-proof the toolchain fetch - the mirror ladder lives in
      # .forgejo/actions/rustup-mirror (see its header for the why).
      - name: Bootstrap rustup through the mirror ladder
        uses: ./.forgejo/actions/rustup-mirror
      - name: Install pinned Rust (1.100)
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.100, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-1.100-${{ runner.arch }}
      - name: Cache cargo registry
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header. This key is IDENTICAL in push-checks
        # and release.yml, so the registry/git store is shared across all
        # workflows on the same arch/toolchain/lockfile.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-1.100-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-1.100-${{ runner.arch }}-
      - name: Cache cargo target
        # Host-target artifacts only; shared by the check jobs, never with
        # release's cross-target legs.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: target
          key: cargo-target-checks-1.100-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-checks-1.100-${{ runner.arch }}-
      - name: Validate the embedded example config
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --config cachette.example.toml --print-config > /dev/null
          echo "OK: cachette.example.toml resolves"
      # Same reasoning as push-checks.yml: `docker-compose config` is file-only
      # validation, so this job fetches the pinned docker/compose standalone
      # release binary and avoids apt / deb.debian.org entirely (the mirror was
      # the flake that failed this job on #31 attempt 1).
      - name: Cache the pinned docker-compose binary
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: /usr/local/bin/docker-compose
          key: docker-compose-5.6.0-${{ runner.arch }}
      - name: Install compose
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - skip the download.
          if docker-compose --version 2>/dev/null | grep -q 'v5.6.0'; then
            echo "docker-compose already present (cachette hit): $(docker-compose --version)"
            exit 0
          fi
          # The docs job may land on any runner of the arch-agnostic fleet,
          # so the pinned compose binary follows the runner arch.
          case "$(uname -m)" in
            x86_64)  asset="docker-compose-linux-x86_64" ;;
            aarch64) asset="docker-compose-linux-aarch64" ;;
            *) echo "::error::unsupported arch for docker-compose: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/docker/compose/releases/download/v5.6.0/${asset}"
          for attempt in 1 2 3; do
            echo "== docker-compose download attempt $attempt =="
            if curl -fsSL --retry 3 --connect-timeout 20 "$url" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose; then
              docker-compose --version
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install docker-compose after 3 attempts"
          exit 1
      - name: Validate compose.yaml
        run: |
          set -euo pipefail
          docker-compose -f compose.yaml config > /dev/null
          echo "OK: compose.yaml parses"

  # ---------------------------------------------------------------------------
  # Docker path on PRs - the same recipes as push-checks.yml's docker job
  # (buildx + the cachette-backed layer cache, plus registry login,
  # push and manifest verification): every PR publishes its flyweight
  # `pr-<number>` head image after the --load validation proves the binary.
  # ---------------------------------------------------------------------------
  docker:
    name: docker
    needs: test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Cache the pinned docker CLI
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: /usr/local/bin/docker
          key: docker-cli-28.0.4-${{ runner.arch }}

      - name: Install docker CLI
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - skip the download.
          if docker --version 2>/dev/null | grep -q '28.0.4'; then
            echo "docker CLI already present (cachette hit): $(docker --version)"
            exit 0
          fi
          url="https://download.docker.com/linux/static/stable/$(uname -m)/docker-28.0.4.tgz"
          for attempt in 1 2 3; do
            echo "== docker download attempt $attempt =="
            if curl -fsSL "$url" | tar xz -C /usr/local/bin --strip-components=1 docker/docker; then
              docker --version
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install the docker CLI after 3 attempts"
          exit 1

      # NO QEMU: the Dockerfile's builder stage is forced to $BUILDPLATFORM
      # and cross-compiles BOTH musl binaries natively (rustc cross + zig cc
      # for the foreign target's C) - no foreign-arch code is ever executed.
      # This also takes gcc-15.2.0-under-QEMU OFF the amd64 build path (it
      # deterministically ICE'd on the bundled sqlite3.c: runs 502/558 at
      # -O3, runs 125-129 at -O2 with libsqlite3-sys 0.39.1).

      # The builder base is the one thing the docker jobs still haul through
      # EXTERNAL hosts: docker.io's blob CDN (production.cloudfront.docker.com)
      # EOF'd per-layer repeatedly while the registry API itself resolves.
      # The socket's native builder consults the host image store FIRST, so a
      # completed pull here short-circuits buildkit's blob transport for the
      # validation build and both native per-arch pushes. Docker Hub pre-signs
      # fresh blob URLs each attempt and docker pull carries its own internal
      # retries - a plain attempt ladder with backoff absorbs the CDN class.
      # The digest is the Dockerfile's pinned index (bump both together).
      - name: Pre-pull the builder base (CDN-retry ladder)
        shell: bash
        run: |
          set -euo pipefail
          base="rust:1.100-alpine"
          digest="sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "== base pull attempt $attempt =="
            if docker pull "docker.io/library/${base}@${digest}"; then
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$ok" -ne 1 ] && docker image inspect "library/${base}@${digest}" >/dev/null 2>&1; then
            echo "::warning::base pull failed on all attempts - proceeding with the locally held pinned copy"
            ok=1
          fi
          [ "$ok" -eq 1 ] || { echo "::error::builder base unavailable after the full pull ladder"; exit 1; }

      # The buildx CLI plugin tracks the latest release. Resolve its tag once
      # via the releases/latest redirect, key the cache by that tag, and assert
      # a restored binary still matches it. github.com downloads stay a cold
      # corner case, not a per-job gamble (cache-binary semantics, kept from
      # the setup-buildx contract).
      - name: Resolve the latest buildx release
        id: buildx_release
        run: |
          set -euo pipefail
          url=""
          for attempt in 1 2 3; do
            url=$(curl -fsSL --retry 3 --connect-timeout 20 \
              -o /dev/null -w '%{url_effective}' \
              https://github.com/docker/buildx/releases/latest) && break
            echo "::warning::buildx release lookup attempt $attempt failed"
            sleep $((attempt * 5))
          done
          tag="${url##*/}"
          case "$tag" in v*) ;; *) echo "::error::could not resolve the latest buildx tag"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest buildx: $tag"

      - name: Cache the buildx CLI
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: /usr/local/lib/docker/cli-plugins/docker-buildx
          key: buildx-${{ steps.buildx_release.outputs.tag }}-${{ runner.arch }}

      - name: Install the buildx CLI (latest)
        env:
          BUILDX_TAG: ${{ steps.buildx_release.outputs.tag }}
        run: |
          set -euo pipefail
          plugin=/usr/local/lib/docker/cli-plugins/docker-buildx
          # Cache hit: the binary was restored and still matches the tag we
          # just resolved, so assert the docker CLI sees it and skip download.
          if "$plugin" version 2>/dev/null | grep -q "$BUILDX_TAG"; then
            echo "buildx from cache: $("$plugin" version)"
            docker buildx version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64)  asset="buildx-${BUILDX_TAG}.linux-amd64" ;;
            aarch64) asset="buildx-${BUILDX_TAG}.linux-arm64" ;;
            *) echo "::error::unsupported arch for buildx: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/docker/buildx/releases/latest/download/${asset}"
          mkdir -p "$(dirname "$plugin")"
          for attempt in 1 2 3; do
            echo "== buildx download attempt $attempt =="
            if curl -fsSL --retry 3 --connect-timeout 20 "$url" -o "$plugin" && chmod +x "$plugin"; then
              "$plugin" version
              exit 0
            fi
            rm -f "$plugin"
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install the buildx CLI after 3 attempts"
          exit 1

      # Account-wide registry token (the same credentials regexYbot's pipelines
      # use): the default GITHUB_TOKEN has no registry write on Forgejo.
      - name: Log in to the forge registry
        uses: https://hangar.nixthedev.ru/docker/login-action@v4
        with:
          registry: hangar.nixthedev.ru
          username: ${{ github.repository_owner }}
          password: ${{ secrets.HGPR_TOKEN }}

      # PR flyweight tag: `pr-<number>` parsed from refs/pull/<number>/merge.
      # `tags` (newline-separated) is the published tag list (feeds
      # build-push-action and the attempt-2 imagetools merge). Per-entry
      # metadata-action tagging was considered and dropped: its tag
      # expressions can only see the github context, not the Cargo.toml
      # version, so tags stay computed here.
      - name: Compute image ref + docker tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="hangar.nixthedev.ru/${owner}/cachette"
          v="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/[^"]*"([^"]*)".*/\1/')"
          pr="${GITHUB_REF#refs/pull/}"
          pr="${pr%%/*}"
          case "${pr}" in
            *[!0-9]*)
              echo "::error::could not parse a numeric PR number out of '${GITHUB_REF}'"
              exit 1
              ;;
          esac
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:pr-${pr}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "verify_ref=${image}:pr-${pr}" >> "$GITHUB_OUTPUT"
          echo "PR flyweight tag: ${image}:pr-${pr} (cachette ${v})"

      # PR flyweight image: multi-arch (linux/amd64 + linux/arm64), the same
      # socket-native ladder as push-checks.yml - native-builder try FIRST
      # (single multi-platform attempt, then per-arch + imagetools merge), and
      # the buildkit-container driver strictly as the last resort.
      #   attempt 1: ONE build-push-action invocation, multi-platform --push.
      #   attempt 2: classic-store-safe route - per-arch build-push-action
      #           pushes to scratch :ci-<arch> tags, then a tiny
      #           buildx imagetools merge composes the published tag.
      #   attempt 3: only-if-1-and-2-failed - setup-buildx-action brings up the
      #           buildkit container builder (pinned buildx) as the last
      #           resort for a stubborn publish.
      # Each attempt is gated on the previous attempt's failure; every build
      # carries the same gha cache-from/cache-to pair - the flags that used
      # to live in the CACHE_FROM/CACHE_ARGS env blobs: mode=max both ways,
      # ignore-error=true covers cache outages DURING the build, and a
      # missing/malformed/expired token is RED at exporter configure time
      # BEFORE the build starts (seen live: "invalid number of segments").
      - name: Publish PR image (attempt 1 - native builder)
        id: attempt1
        continue-on-error: true
        uses: https://hangar.nixthedev.ru/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
          cache-to: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true

      - name: Publish amd64 scratch tag (attempt 2)
        id: attempt2_amd
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: https://hangar.nixthedev.ru/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.image }}:ci-amd64
          cache-from: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
          cache-to: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true

      - name: Publish arm64 scratch tag (attempt 2)
        id: attempt2_arm
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: https://hangar.nixthedev.ru/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.image }}:ci-arm64
          cache-from: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
          cache-to: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true

      - name: Merge into the manifest list (attempt 2)
        id: attempt2_merge
        if: steps.attempt2_amd.outcome == 'success' && steps.attempt2_arm.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          amd="${{ steps.tags.outputs.image }}:ci-amd64"
          arm="${{ steps.tags.outputs.image }}:ci-arm64"
          docker buildx imagetools create -t "${{ steps.tags.outputs.verify_ref }}" "$amd" "$arm"
          echo "OK: ${{ steps.tags.outputs.verify_ref }} -> manifest list (linux/amd64 + linux/arm64)"

      # Rung 3: the setup-buildx contract via setup-buildx-action -
      # docker-container driver (its default), pinned buildx version,
      # cache-binary on (its default). No continue-on-error here: if the
      # container builder cannot even start after attempts 1-2 failed, the job
      # is genuinely red.
      # The builder itself is PINNED: one generic name (ci),
      # shared by any workflow on this host that pins the same name - an
      # existing builder is adopted instead of spawning a fresh
      # docker-buildx-<random> container per run, and cleanup=false leaves
      # it standing (warm buildkit state included) on the runner host
      # instead of piling temp builders into its storage.
      - name: Set up the buildkit container builder (attempt 3)
        id: attempt3_builder
        if: steps.attempt1.outcome == 'failure' && (steps.attempt2_merge.outcome == 'failure' || steps.attempt2_merge.outcome == 'skipped')
        uses: https://hangar.nixthedev.ru/docker/setup-buildx-action@v4
        with:
          name: ci
          cleanup: false

      - name: Publish PR image (attempt 3 - container builder)
        id: attempt3
        if: steps.attempt3_builder.outcome == 'success'
        uses: https://hangar.nixthedev.ru/docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          builder: ${{ steps.attempt3_builder.outputs.name }}
          cache-from: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
          cache-to: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true

      # Acceptance: the pushed pr-N tag must be a manifest list covering BOTH
      # architectures.
      - name: Verify manifest lists amd64 AND arm64
        run: |
          set -euo pipefail
          ref="${{ steps.tags.outputs.verify_ref }}"
          manifest="$(docker manifest inspect "$ref")"
          echo "$manifest"
          echo "$manifest" | grep -q '"architecture": "amd64"'
          echo "$manifest" | grep -q '"architecture": "arm64"'
          echo "OK: $ref is a manifest list with amd64 + arm64"

      # Boot-check of the pr flyweight image, NOTICE-ONLY (PR head images
      # are allowed to be broken): docker run pulls the runner's native
      # platform from the registry manifest list and asserts the binary
      # reports the Cargo.toml-derived version. It never fails the job -
      # a non-booting pr image is reported as NOTICE lines plus a
      # ::notice:: annotation.
      - name: Boot-check the pr image (notice only)
        id: bootcheck
        continue-on-error: true
        run: |
          set -euo pipefail
          ref="${{ steps.tags.outputs.verify_ref }}"
          want="cachette ${{ steps.tags.outputs.version }}"
          if ! got="$(docker run --rm "$ref" --version 2>&1)"; then
            echo "NOTICE: the pr image did not boot: $ref"
            echo "$got"
            echo "::notice::The pr image did not boot: $ref"
            exit 0
          fi
          echo "cachette --version => [$got]"
          # Derived from Cargo.toml in the tags step - a version bump can
          # never leave this check stale.
          if [ "$got" = "$want" ]; then
            echo "OK: pr image booted and reports [$want]"
          else
            echo "NOTICE: pr image booted but --version mismatch: [$got] != [$want]"
            echo "::notice::The pr image booted with a version mismatch: [$got] != [$want]"
          fi
