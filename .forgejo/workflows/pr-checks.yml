# PR gate for cachette (was ci.yml; the push twin is push-checks.yml).
# Same five jobs, same semantics - split out only so that a
# pull-request run and a push run no longer auto-cancel each other, and so
# the two triggers read independently.
#
# The docker job here pushes the PR head image: a local --load build first
# (native-runner-arch, with the binary `--version` assert), then a real publish
# multi-arch on the flyweight `pr-<PR number>` tag. Both legs exercise the
# cachette buildkit layer cache
# (docker buildx `type=gha` -> acc.nixthedev.ru; `CACHETTE_BUILDX_JWT` static
# bearer, minted per docs/clients.md; a missing/malformed/expired token is
# RED at exporter configure time, not a mere cache miss).
#
# See push-checks.yml for the per-job notes (cargo cache, real-client toolchain
# requirements, the static docker-compose install, tag scheme).
name: PR Checks

on:
  pull_request:
    branches: [release]

# Operates on the PR's own head branches; distinct group name so PR invocations
# are only superseded by newer PR invocations, not by push-checks runs.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install rustfmt toolchain
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      # No cargo cache here on purpose: `cargo fmt` builds nothing, so a
      # registry/target cache would churn bytes for nothing (cache rationale
      # lives in the NOTE (Actions cache) block of release.yml's header).
      - name: rustfmt --check
        run: cargo fmt --all -- --check

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install stable Rust
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header. Job-scoped key (check/clippy/test
        # keep separate targets like rust-cache's default isolation), pinned
        # on dtolnay's rust `cachekey` + the Cargo.lock hash, with a
        # restore-keys fallback for lockfile drift.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install clippy toolchain
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header; job-scoped key, see the check job.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install stable Rust
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Install Node.js
        uses: https://hangar.nixthedev.ru/actions/setup-node@v4
        with:
          node-version: "20"
          # Built-in restore-at-start/store-at-end of the npm tarballs via the
          # toolkit; the fixture's `npm ci` then makes no registry fetches.
          cache: "npm"
          cache-dependency-path: tests/fixtures/package-lock.json
      - name: Install Go
        uses: https://hangar.nixthedev.ru/actions/setup-go@v5
        with:
          go-version: "1.25"
      # Both setup steps above cache through the toolkit natively
      # (restore-at-start / store-at-end): node caches the npm tarballs, go caches
      # ~/.cache/go-build + ~/go/pkg/mod by default - so the vendored fixture
      # builds below don't refetch/recompile from zero each run.
      - name: Cache cargo registry/build
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header; job-scoped key, see the check job.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: Assert real-client toolchains are present
        run: |
          set -euo pipefail
          node --version
          npm --version
          go version
      - name: cargo test
        run: cargo test --workspace --locked

  docs:
    name: docs
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install stable Rust
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact stable version,
      # so the next stable bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header; job-scoped key, see the check job.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: Validate the embedded example config
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --config cachette.example.toml --print-config > /dev/null
          echo "OK: cachette.example.toml resolves"
      # Same reasoning as push-checks.yml: `docker-compose config` is file-only
      # validation, so this job fetches the pinned docker/compose standalone
      # release binary and avoids apt / deb.debian.org entirely (the mirror was
      # the flake that failed this job on #31 attempt 1).
      - name: Cache the pinned docker-compose binary
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: /usr/local/bin/docker-compose
          key: docker-compose-5.6.0-${{ runner.arch }}
      - name: Install compose
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - skip the download.
          if docker-compose --version 2>/dev/null | grep -q 'v5.6.0'; then
            echo "docker-compose already present (cachette hit): $(docker-compose --version)"
            exit 0
          fi
          # The docs job may land on any runner of the arch-agnostic fleet,
          # so the pinned compose binary follows the runner arch.
          case "$(uname -m)" in
            x86_64)  asset="docker-compose-linux-x86_64" ;;
            aarch64) asset="docker-compose-linux-aarch64" ;;
            *) echo "::error::unsupported arch for docker-compose: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/docker/compose/releases/download/v5.6.0/${asset}"
          for attempt in 1 2 3; do
            echo "== docker-compose download attempt $attempt =="
            if curl -fsSL --retry 3 --connect-timeout 20 "$url" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose; then
              docker-compose --version
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install docker-compose after 3 attempts"
          exit 1
      - name: Validate compose.yaml
        run: |
          set -euo pipefail
          docker-compose -f compose.yaml config > /dev/null
          echo "OK: compose.yaml parses"

  # ---------------------------------------------------------------------------
  # Docker path on PRs - the same recipes as push-checks.yml's docker job
  # (QEMU + buildx + the cachette-backed layer cache, plus registry login,
  # push and manifest verification): every PR publishes its flyweight
  # `pr-<number>` head image after the --load validation proves the binary.
  # ---------------------------------------------------------------------------
  docker:
    name: docker
    needs: test
    runs-on: linux-amd64
    env:
      CARGO_TERM_COLOR: always
      # CACHE_FROM feeds the socket-native builds (docker driver can import
      # gha caches). CACHE_ARGS additionally exports (from+to) for the
      # multi-arch step's container fallback - the docker driver cannot
      # EXPORT caches without the containerd image store, plus the
      # exporter-config failures are not covered by ignore-error=true.
      CACHE_FROM: >-
        --cache-from type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
      CACHE_ARGS: >-
        --cache-from type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
        --cache-to type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Cache the pinned docker CLI
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: /usr/local/bin/docker
          key: docker-cli-28.0.4-${{ runner.arch }}

      - name: Install docker CLI
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - skip the download.
          if docker --version 2>/dev/null | grep -q '28.0.4'; then
            echo "docker CLI already present (cachette hit): $(docker --version)"
            exit 0
          fi
          url="https://download.docker.com/linux/static/stable/$(uname -m)/docker-28.0.4.tgz"
          for attempt in 1 2 3; do
            echo "== docker download attempt $attempt =="
            if curl -fsSL "$url" | tar xz -C /usr/local/bin --strip-components=1 docker/docker; then
              docker --version
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install the docker CLI after 3 attempts"
          exit 1

      - name: Set up QEMU
        uses: https://hangar.nixthedev.ru/docker/setup-qemu-action@v3

      # The builder base is the one thing the docker jobs still haul through
      # EXTERNAL hosts: docker.io's blob CDN (production.cloudfront.docker.com)
      # EOF'd per-layer repeatedly while the registry API itself resolves.
      # The socket's native builder consults the host image store FIRST, so a
      # completed pull here short-circuits buildkit's blob transport for the
      # validation build and both native per-arch pushes. Docker Hub pre-signs
      # fresh blob URLs each attempt and docker pull carries its own internal
      # retries - a plain attempt ladder with backoff absorbs the CDN class.
      # The digest is the Dockerfile's pinned index (bump both together).
      - name: Pre-pull the builder base (CDN-retry ladder)
        shell: bash
        run: |
          set -euo pipefail
          base="rust:1.98-alpine"
          digest="sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "== base pull attempt $attempt =="
            if docker pull "docker.io/library/${base}@${digest}"; then
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$ok" -ne 1 ] && docker image inspect "library/${base}@${digest}" >/dev/null 2>&1; then
            echo "::warning::base pull failed on all attempts - proceeding with the locally held pinned copy"
            ok=1
          fi
          [ "$ok" -eq 1 ] || { echo "::error::builder base unavailable after the full pull ladder"; exit 1; }

      # The buildx CLI plugin: Cache the pinned binary and skip the per-job
      # GitHub gamble. The setup-buildx-action re-downloaded the buildx
      # binary from github.com on EVERY job and died three times in a row
      # on a flaky proxy window (empty ::error:: after 21s in the download
      # group). The pin means the download is a cold, cache-evicted-miss
      # corner case instead of a per-job dice roll.
      - name: Cache the pinned buildx CLI
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: /usr/local/lib/docker/cli-plugins/docker-buildx
          key: buildx-0.38.1-${{ runner.arch }}

      - name: Pin the buildx CLI
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - assert the docker
          # CLI sees the plugin - skip the download.
          if /usr/local/lib/docker/cli-plugins/docker-buildx version 2>/dev/null | grep -q 'v0.38.1'; then
            echo "buildx present from cache: $(/usr/local/lib/docker/cli-plugins/docker-buildx version)"
            docker buildx version
            exit 0
          fi
          # The daemon may bundle its own buildx (Docker Desktop does) -
          # version-matched against the pin, so the cache key stays honest.
          if docker buildx version 2>/dev/null | grep -q 'v0.38.1'; then
            echo "buildx bundled by the daemon matches the pin: $(docker buildx version)"
            exit 0
          fi
          case "$(uname -m)" in
            x86_64)  asset="buildx-v0.38.1.linux-amd64" ;;
            aarch64) asset="buildx-v0.38.1.linux-arm64" ;;
            *) echo "::error::unsupported arch for buildx: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/docker/buildx/releases/download/v0.38.1/${asset}"
          mkdir -p /usr/local/lib/docker/cli-plugins
          for attempt in 1 2 3; do
            echo "== buildx download attempt $attempt =="
            if curl -fsSL --retry 3 --connect-timeout 20 "$url" -o /usr/local/lib/docker/cli-plugins/docker-buildx && chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx; then
              /usr/local/lib/docker/cli-plugins/docker-buildx version
              exit 0
            fi
            rm -f /usr/local/lib/docker/cli-plugins/docker-buildx
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install the buildx CLI after 3 attempts"
          exit 1

      # Builder model, socket-native edition: the DEFAULT (docker) builder -
      # the buildkit engine inside the persistent host dockerd - serves the
      # validation build and both per-arch pushes; its build cache survives
      # jobs on the same host, so warm runners skip base transports and
      # recompiles entirely. The docker-container builder from the old
      # setup-buildx contract is created on demand ONLY inside the
      # multi-arch step's container fallback (built, used, released there).

      # Account-wide registry token (the same credentials regexYbot's pipelines
      # use): the default GITHUB_TOKEN has no registry write on Forgejo.
      - name: Log in to the forge registry
        uses: https://hangar.nixthedev.ru/docker/login-action@v3
        with:
          registry: hangar.nixthedev.ru
          username: ${{ github.repository_owner }}
          password: ${{ secrets.HGPR_TOKEN }}

      # PR flyweight tag: `pr-<number>` parsed from refs/pull/<number>/merge.
      # TAGFLAGS is what the push step publishes; LOCALFLAGS is the throwaway
      # local tag for the --load validation + --version assert.
      - name: Compute image ref + docker tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="hangar.nixthedev.ru/${owner}/cachette"
          pr="${GITHUB_REF#refs/pull/}"
          pr="${pr%%/*}"
          case "${pr}" in
            *[!0-9]*)
              echo "::error::could not parse a numeric PR number out of '${GITHUB_REF}'"
              exit 1
              ;;
          esac
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "verify_ref=${image}:pr-${pr}" >> "$GITHUB_OUTPUT"
          echo "TAGFLAGS=--tag ${image}:pr-${pr}" >> "$GITHUB_ENV"
          echo "LOCALFLAGS=--tag cachette:ci-dryrun" >> "$GITHUB_ENV"
          # Newline list for the native path's client-side manifest merge.
          {
            echo "tag_list<<EOF"
            echo "${image}:pr-${pr}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "TAGFLAGS=--tag ${image}:pr-${pr}"

      - name: Validation build
        shell: bash
        run: |
          set -euo pipefail
          # No --platform pin: buildx builds the runner's NATIVE arch, so the
          # validation stays native on every fleet runner (arm64 included).
          # Builder: the socket's default (docker driver) - the buildkit that
          # lives inside the PERSISTENT host dockerd, whose build cache
          # survives jobs on the same host (warm runners skip base transports
          # and recompiles). Reads-only on cache: the docker driver imports
          # gha caches but cannot EXPORT without the containerd image store -
          # the container fallback keeps cache-export duty (multi-arch step).
          docker buildx build --builder default --load ${LOCALFLAGS} ${CACHE_FROM} .
          got="$(docker run --rm cachette:ci-dryrun --version)"
          echo "cachette --version => [$got]"
          # Derive from Cargo.toml like the tags step does upstream - a
          # version bump can never leave this assert stale (the hardcoded
          # 1.0.0 went red on the 1.1 head, task 125).
          v="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/[^"]*"([^"]*)".*/\1/')"
          [ "$got" = "cachette ${v}" ]

      # PR flyweight image: multi-arch (linux/amd64 + linux/arm64), same
      # socket-native recipe as push-checks.yml: native-builder try FIRST
      # (single multi-platform rung, then per-arch + client manifest merge),
      # and the per-run buildkit container with its retry ladder + full
      # cache-export duties strictly as the last resort.
      - name: Build + push PR image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.tags.outputs.image }}"
          amd="${image}:ci-amd64"
          arm="${image}:ci-arm64"

          # Rung 1: one multi-platform build ending in a pushed manifest list.
          if (
            set -euo pipefail
            docker buildx build --builder default \
              --platform linux/amd64,linux/arm64 \
              ${TAGFLAGS} ${CACHE_FROM} --push .
          ); then
            echo "OK: pushed ${image}:pr-${{ steps.tags.outputs.pr }} via the native multi-platform build"
            exit 0
          fi
          echo "::warning::native multi-platform try rejected/died - stepping to rung 2: per-arch + manifest merge"

          # Rung 2: classic-store-safe per-arch route + client-side merge.
          if (
            set -euo pipefail
            docker buildx build --builder default --platform linux/amd64 -t "$amd" ${CACHE_FROM} .
            docker buildx build --builder default --platform linux/arm64 -t "$arm" ${CACHE_FROM} .
            docker push "$amd"
            docker push "$arm"
            export DOCKER_CLI_EXPERIMENTAL=enabled
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              docker manifest create "$tag" "$amd" "$arm"
              docker manifest push "$tag"
              echo "OK: $tag -> manifest list (linux/amd64 + linux/arm64)"
            done <<< "${{ steps.tags.outputs.tag_list }}"
          ); then
            echo "OK: pushed ${image}:pr-${{ steps.tags.outputs.pr }} via per-arch native builds + manifest merge"
            exit 0
          fi
          echo "::warning::per-arch native route failed - falling back to the buildkit-container driver"

          # Rung 3: the original setup-buildx contract, unchanged.
          builder="cachette-ci-${RANDOM}${RANDOM}"
          cleanup() { docker buildx rm "${builder}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker buildx create --name "${builder}" --driver docker-container --use
          docker buildx inspect --bootstrap "${builder}" | sed -n '1,16p'
          ok=0
          for attempt in 1 2 3 4; do
            echo "== container push attempt $attempt =="
            if docker buildx build \
                --platform linux/amd64,linux/arm64 \
                ${TAGFLAGS} \
                ${CACHE_ARGS} \
                --push \
                .; then
              echo "OK: pushed ${image}:pr-${{ steps.tags.outputs.pr }} via the container builder"
              ok=1
              break
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          [ "$ok" -eq 1 ] || { echo "::error::multi-arch PR image push failed on all three rungs"; exit 1; }

      # Acceptance: the pushed pr-N tag must be a manifest list covering BOTH
      # architectures.
      - name: Verify manifest lists amd64 AND arm64
        run: |
          set -euo pipefail
          ref="${{ steps.tags.outputs.verify_ref }}"
          manifest="$(docker manifest inspect "$ref")"
          echo "$manifest"
          echo "$manifest" | grep -q '"architecture": "amd64"'
          echo "$manifest" | grep -q '"architecture": "arm64"'
          echo "OK: $ref is a manifest list with amd64 + arm64"
