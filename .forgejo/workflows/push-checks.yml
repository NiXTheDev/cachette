# Push gate for cachette (was ci.yml; the pull_request twin is pr-checks.yml):
# parallel static checks that must ALL pass before any test runs. The tag path
# (cross-build -> checksums -> release) lives in release.yml.

# The static checks run as independent, PARALLEL jobs so a deliberately broken
# fmt / typecheck / clippy turns its own gate red on its own:
#
#   fmt      - rustfmt --all -- --check
#   check    - cargo check --workspace --all-targets (typecheck)
#   clippy   - cargo clippy --workspace --all-targets -- -D warnings
#
# Every downstream job `needs:` all three, so a failure in any static check
# short-circuits the pipeline before any (expensive) test work starts:
#
#   test     - the ENTIRE test suite in a single job/step: unit + integration
#              + the v1/v2 real clients (@actions/cache toolkit + vendored
#              go-actions-cache CacheService) + the multi-node cluster suites
#              (placement, relay, fan-out, drain, mTLS). `cargo test --workspace`
#              already covers every suite exactly once. node/npm/go MUST be
#              present; a missing toolchain FAILS the job - it never silently
#              skips (plan tasks 22/27). The process-level 3-node harness (plan
#              task 33) is GATED on the v2.0 cluster listener and is not present
#              yet; the in-process suites are its current stand-in.
#   docs     - the embedded example config resolves (`--print-config`) and
#              compose.yaml parses (`docker-compose config`).
#
# docker     - the image path lives HERE (regexYbot-shaped split: the forge
#              registry publish belongs to branch pushes, not to the release
#              job). EVERY branch push builds and pushes the multi-arch
#              (linux/amd64,linux/arm64) image; `release` gets the bare-semver
#              tag scheme (latest, release, 1.0.0, and the parent truncations
#              1.0 / 1) read from Cargo.toml, any other branch gets regexY's
#              dev scheme (dev, latest, <version>-dev, and the truncations as
#              -dev). Registry auth is the account-wide HGPR_TOKEN secret.
#              The docker job reads AND writes the buildkit layer cache via
#              the cachette-served gha cache (docker buildx `type=gha` ->
#              acc.nixthedev.ru; `CACHETTE_BUILDX_JWT` is the static
#              bearer token, minted per docs/clients.md; the value MUST be
#              JWT-shaped (three dot-separated segments carrying ac/exp/nbf,
#              with exp years in the future) - a missing, malformed, or
#              expired token is RED at exporter configure time, BEFORE the
#              build starts). The persistent host buildkit inside the warm
#              dockerd is the second cache layer and needs no configuration
#              - a dockerd restart/prune just re-warms from gha. The
#              build/push/cache machinery is the docker.org action family
#              (setup-qemu, login-action, setup-buildx, build-push-action)
#              driven by the persistent socket builder; only the scripts
#              that compute the tag scheme and assert the result remain
#              hand-rolled. After the ladder a boot-check pulls the runner's
#              native platform of the PUBLISHED image (docker run + the
#              Cargo.toml-derived --version assert) and FAILS the job on a
#              release-branch push; on every other ref it is notice-only.
#              There is no registry buildcache and no on-disk
#              cache snapshot.
#
# NOTE (Forgejo): a `permissions:` key is NOT supported - the instance logs
# "Job ... has a permissions field, which is not supported in Forgejo and will
# be ignored. Use Authorized Integrations ...". Capabilities come from the
# forge's Authorized Integrations, so none is declared here.
#
# NOTE (job budgets): the per-job `timeout-minutes` caps were removed - the
# runner-level job timeout (24h on every runner of the fleet) now applies
# per job: docker gets 24h, docs gets 24h, and so on, each with its own
# window. Lesson worth keeping visible: `static.rust-lang.org` is very slow
# from these runners (~65 KB/s), so a cold `rustup toolchain install` alone
# can eat 20-25 min. The rustup toolchains dir is itself cached (keyed on
# dtolnay's `cachekey` output), so the download happens once per stable
# version - but a job killed mid-install seeds nothing, so the clock needs
# real headroom, and a killed compile also loses its in-flight layer cache.
name: Push Checks

on:
  push:
    # Every branch; tags are deliberately excluded (release.yml owns tag pushes,
    # and a tag push must not re-run the whole CI suite).
    branches: ["**"]

# Cancel superseded runs on the same branch (cheap, keeps the queue short).
# Distinct group names keep push runs and pr-checks runs from cancelling
# each other, which a single ci.yml used to cause.
concurrency:
  group: push-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install rustfmt toolchain
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
          components: rustfmt
      # The component fetch is its own network leg and rustup carries no
      # ladder (run 5's fmt died in 14s when the toolchain host EOF'd
      # mid-`rustup component add`, and 992ba8e's fmt/check/clippy legs
      # relapsed the same class). `rustup component add` no-ops in ~1s
      # when the component is already in place, so the common path pays
      # nothing; a poisoned/rejected fetch gets three retries with backoff
      # and a loud tool-level error instead of a bare rustup wall.
      - name: Ensure the components landed (retry ladder)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if rustup component add rustfmt; then
              cargo fmt --version
              exit 0
            fi
            echo "component add attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::rustfmt was not fetched after 4 attempts"
          exit 1
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.99, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      # No cargo cache here on purpose: `cargo fmt` builds nothing, so a
      # registry/target cache would churn bytes for nothing (cache rationale
      # lives in the NOTE (Actions cache) block of release.yml's header).
      - name: rustfmt --check
        run: cargo fmt --all -- --check

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install pinned Rust (1.99)
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.99, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header. Job-scoped key (check/clippy/test
        # keep separate targets like rust-cache's default isolation), pinned
        # on dtolnay's rust `cachekey` + the Cargo.lock hash, with a
        # restore-keys fallback for lockfile drift.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install clippy toolchain
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
          components: clippy
      # Same component-fetch ladder as the fmt job (docs above).
      - name: Ensure the components landed (retry ladder)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if rustup component add clippy; then
              cargo clippy --version
              exit 0
            fi
            echo "component add attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::clippy was not fetched after 4 attempts"
          exit 1
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.99, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header; job-scoped key, see the check job.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install pinned Rust (1.99)
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.99, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      # node/npm drive the @actions/cache v3 toolkit fixture; go drives the
      # vendored go-actions-cache client. Both are REQUIRED (the real-client
      # tests fail, not skip, when a toolchain is missing).
      - name: Install Node.js
        uses: https://hangar.nixthedev.ru/actions/setup-node@v4
        with:
          node-version: "20"
          # Built-in restore-at-start/store-at-end of the npm tarballs via the
          # toolkit; the fixture's `npm ci` then makes no registry fetches.
          cache: "npm"
          cache-dependency-path: tests/fixtures/package-lock.json
      - name: Install Go
        uses: https://hangar.nixthedev.ru/actions/setup-go@v5
        with:
          go-version: "1.25"
      # Both setup steps above cache through the toolkit natively
      # (restore-at-start / store-at-end): node caches the npm tarballs, go caches
      # ~/.cache/go-build + ~/go/pkg/mod by default - so the vendored fixture
      # builds below don't refetch/recompile from zero each run.
      - name: Cache cargo registry/build
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header; job-scoped key, see the check job.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-
      # Fail loudly BEFORE cargo if a toolchain is absent: a real-client test
      # must never degenerate into a silent skip (plan tasks 22/27).
      - name: Assert real-client toolchains are present
        run: |
          set -euo pipefail
          node --version
          npm --version
          go version
      # EVERY suite the workspace has runs here, in this single step: unit +
      # integration + v1/v2 real clients + the multi-node cluster suites.
      # `--workspace` already includes them all, so each test runs exactly once.
      - name: cargo test
        run: cargo test --workspace --locked

  docs:
    name: docs
    needs: [fmt, check, clippy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4
      - name: Install pinned Rust (1.99)
        id: toolchain
        uses: https://hangar.nixthedev.ru/dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
      # Restore the rustup toolchains dir (the ~20-25 min download on these
      # runners); dtolnay's `cachekey` output pins the exact toolchain
      # version (pinned: 1.99, the version the battery + docker base
      # validate), so the next bump retargets the cache by itself.
      - name: Cache rustup toolchains
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: ~/.rustup/toolchains
          key: rustup-toolchains-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Cache cargo registry/build
        # Plain actions/cache@v6, NOT rust-cache@v2 - rationale in the cache
        # NOTE of release.yml's header; job-scoped key, see the check job.
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ steps.toolchain.outputs.cachekey }}-
      # The embedded example must resolve end to end (env + file + derived
      # defaults validated); --print-config masks secrets and exits non-zero on
      # any invalid key.
      - name: Validate the embedded example config
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- --config cachette.example.toml --print-config > /dev/null
          echo "OK: cachette.example.toml resolves"
      # This job needs none of the docker machinery: `docker-compose config`
      # is a pure file validation (parse + interpolate + schema), so the docs
      # job downloads the pinned docker/compose standalone release binary and
      # touches neither apt nor deb.debian.org. That path was the flake source:
      # pr-checks #31 lost three update+install retries in a row (index fetches
      # dying or warning out to exit 0, install then reporting "E: Unable to
      # locate package docker-cli") while the identical block ran green in
      # push-checks minutes later. The mirror is the hazard - drop it, don't
      # retry it.
      - name: Cache the pinned docker-compose binary
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: /usr/local/bin/docker-compose
          key: docker-compose-5.6.0-${{ runner.arch }}
      - name: Install compose
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - skip the download.
          if docker-compose --version 2>/dev/null | grep -q 'v5.6.0'; then
            echo "docker-compose already present (cachette hit): $(docker-compose --version)"
            exit 0
          fi
          # The docs job may land on any runner of the arch-agnostic fleet,
          # so the pinned compose binary follows the runner arch.
          case "$(uname -m)" in
            x86_64)  asset="docker-compose-linux-x86_64" ;;
            aarch64) asset="docker-compose-linux-aarch64" ;;
            *) echo "::error::unsupported arch for docker-compose: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/docker/compose/releases/download/v5.6.0/${asset}"
          for attempt in 1 2 3; do
            echo "== docker-compose download attempt $attempt =="
            if curl -fsSL --retry 3 --connect-timeout 20 "$url" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose; then
              docker-compose --version
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install docker-compose after 3 attempts"
          exit 1
      - name: Validate compose.yaml
        run: |
          set -euo pipefail
          docker-compose -f compose.yaml config > /dev/null
          echo "OK: compose.yaml parses"

  # ---------------------------------------------------------------------------
  # THE docker job. This is the only place cachette's OCI image is ever built -
  # every branch push publishes it with its ref's tag scheme.
  # ---------------------------------------------------------------------------
  docker:
    name: docker
    needs: test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: https://hangar.nixthedev.ru/actions/checkout@v4

      - name: Cache the pinned docker CLI
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: /usr/local/bin/docker
          key: docker-cli-28.0.4-${{ runner.arch }}

      # Docker CLI as a STATIC binary (the recipe regexYbot's proven on these
      # exact runners) - avoids apt and deb.debian.org entirely. Only the
      # client is needed: buildx (set up just below) runs buildkit in its own
      # container; no dockerd is involved in this job.
      - name: Install docker CLI
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - skip the download.
          if docker --version 2>/dev/null | grep -q '28.0.4'; then
            echo "docker CLI already present (cachette hit): $(docker --version)"
            exit 0
          fi
          url="https://download.docker.com/linux/static/stable/$(uname -m)/docker-28.0.4.tgz"
          for attempt in 1 2 3; do
            echo "== docker download attempt $attempt =="
            if curl -fsSL "$url" | tar xz -C /usr/local/bin --strip-components=1 docker/docker; then
              docker --version
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install the docker CLI after 3 attempts"
          exit 1

      - name: Set up QEMU
        uses: https://hangar.nixthedev.ru/docker/setup-qemu-action@v3.7.0
        with:
          platforms: linux/amd64,linux/arm64

      # The builder base is the one thing the docker jobs still haul through
      # EXTERNAL hosts: docker.io's blob CDN (production.cloudfront.docker.com)
      # EOF'd per-layer repeatedly while the registry API itself resolves.
      # The socket's native builder consults the host image store FIRST, so a
      # completed pull here short-circuits buildkit's blob transport for the
      # validation build and both native per-arch pushes. Docker Hub pre-signs
      # fresh blob URLs each attempt and docker pull carries its own internal
      # retries - a plain attempt ladder with backoff absorbs the CDN class.
      # The digest is the Dockerfile's pinned index (bump both together).
      - name: Pre-pull the builder base (CDN-retry ladder)
        shell: bash
        run: |
          set -euo pipefail
          base="rust:1.98-alpine"
          digest="sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "== base pull attempt $attempt =="
            if docker pull "docker.io/library/${base}@${digest}"; then
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$ok" -ne 1 ] && docker image inspect "library/${base}@${digest}" >/dev/null 2>&1; then
            echo "::warning::base pull failed on all attempts - proceeding with the locally held pinned copy"
            ok=1
          fi
          [ "$ok" -eq 1 ] || { echo "::error::builder base unavailable after the full pull ladder"; exit 1; }

      # The buildx CLI plugin: Cache the pinned binary and skip the per-job
      # GitHub gamble (the re-downloads died three times in a row on a flaky
      # proxy window). Cache hit -> assert the docker CLI sees the plugin.
      # Then the daemon may bundle its own buildx (Docker Desktop does) -
      # version-matched against the pin so the cache key stays honest; the
      # github.com download stays a cold corner case, not a per-job dice
      # roll (cache-binary semantics, kept from the setup-buildx contract).
      - name: Cache the pinned buildx CLI
        uses: https://hangar.nixthedev.ru/actions/cache@v6
        with:
          path: /usr/local/lib/docker/cli-plugins/docker-buildx
          key: buildx-0.38.1-${{ runner.arch }}

      - name: Pin the buildx CLI
        run: |
          set -euo pipefail
          # Cache hit: the pinned binary was restored - assert the docker
          # CLI sees the plugin - skip the download.
          if /usr/local/lib/docker/cli-plugins/docker-buildx version 2>/dev/null | grep -q 'v0.38.1'; then
            echo "buildx present from cache: $(/usr/local/lib/docker/cli-plugins/docker-buildx version)"
            docker buildx version
            exit 0
          fi
          # The daemon may bundle its own buildx (Docker Desktop does) -
          # version-matched against the pin, so the cache key stays honest.
          if docker buildx version 2>/dev/null | grep -q 'v0.38.1'; then
            echo "buildx bundled by the daemon matches the pin: $(docker buildx version)"
            exit 0
          fi
          case "$(uname -m)" in
            x86_64)  asset="buildx-v0.38.1.linux-amd64" ;;
            aarch64) asset="buildx-v0.38.1.linux-arm64" ;;
            *) echo "::error::unsupported arch for buildx: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/docker/buildx/releases/download/v0.38.1/${asset}"
          mkdir -p /usr/local/lib/docker/cli-plugins
          for attempt in 1 2 3; do
            echo "== buildx download attempt $attempt =="
            if curl -fsSL --retry 3 --connect-timeout 20 "$url" -o /usr/local/lib/docker/cli-plugins/docker-buildx && chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx; then
              /usr/local/lib/docker/cli-plugins/docker-buildx version
              exit 0
            fi
            rm -f /usr/local/lib/docker/cli-plugins/docker-buildx
            echo "attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not install the buildx CLI after 3 attempts"
          exit 1

      # Account-wide registry token (the same credentials regexYbot's pipelines
      # use): the default GITHUB_TOKEN has no registry write on Forgejo.
      - name: Log in to the forge registry
        uses: https://hangar.nixthedev.ru/docker/login-action@v3.7.0
        with:
          registry: hangar.nixthedev.ru
          username: ${{ github.repository_owner }}
          password: ${{ secrets.HGPR_TOKEN }}

      # Tags follow the proven regexYbot scheme: mutable aliases + the bare
      # Cargo.toml version (NO `v` prefix) + parent truncation (1.0.0 -> 1.0 -> 1).
      # - `release`: latest, release, <v> + truncations.
      # - any other branch: regexY's dev semantics - dev, latest, <v>-dev plus
      #   the truncations as -dev (the mutable aliases track dev heads until
      #   the next release push re-points them).
      # `tags` (newline-separated) is the published tag list (feeds
      # build-push-action and the rung-2 imagetools merge). Per-entry
      # metadata-action tagging was considered and dropped: its tag
      # expressions can only see the github context, not the Cargo.toml
      # version, so the version family cannot live inside type=raw entries.
      - name: Compute image ref + docker tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="hangar.nixthedev.ru/${owner}/cachette"
          v="$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/[^"]*"([^"]*)".*/\1/')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/heads/release" ]; then
            suffixes="latest release ${v}"
            cur="${v}"
            while :; do
              prev="${cur}"
              cur="$(printf '%s' "${cur}" | sed 's/\.[^.]*$//')"
              if [ -z "${cur}" ] || [ "${cur}" = "${prev}" ]; then break; fi
              suffixes="${suffixes} ${cur}"
            done
            verify="${image}:${v}"
          else
            suffixes="dev latest ${v}-dev"
            cur="${v}"
            while :; do
              prev="${cur}"
              cur="$(printf '%s' "${cur}" | sed 's/\.[^.]*$//')"
              if [ -z "${cur}" ] || [ "${cur}" = "${prev}" ]; then break; fi
              suffixes="${suffixes} ${cur}-dev"
            done
            verify="${image}:dev"
          fi
          tags="$(for s in ${suffixes}; do echo "${image}:${s}"; done)"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "verify_ref=${verify}" >> "$GITHUB_OUTPUT"
          echo "tags for cachette ${v}:"
          echo "${tags}"

      # THE multi-arch push (linux/amd64 + linux/arm64) - every branch push
      # publishes with its ref's tag scheme, tried on the socket's native
      # builder FIRST (proven locally on Docker Desktop: native driver built
      # the full dual-arch manifest list, binfmt handled arm64, cargo
      # cache-mounts held the compile in the ~30s class):
      #   rung 1: ONE build-push-action invocation, multi-platform --push
      #           (containerd-store daemons do this outright).
      #   rung 2: classic-store-safe route - per-arch build-push-action
      #           pushes to scratch :ci-<arch> tags, then a tiny
      #           buildx imagetools merge composes each published tag
      #           (registry-side, no DOCKER_CLI_EXPERIMENTAL needed).
      #   rung 3: only-if-1-and-2-failed - setup-buildx-action brings up the
      #           buildkit container builder (pinned buildx) as the last
      #           resort for a stubborn publish.
      # Each rung is gated on the previous rung's failure; every build
      # carries the same gha cache-from/cache-to pair - the flags that used
      # to live in the CACHE_FROM/CACHE_ARGS env blobs: mode=max both ways,
      # ignore-error=true covers cache outages DURING the build, and a
      # missing/malformed/expired token is RED at exporter configure time
      # BEFORE the build starts (seen live: "invalid number of segments").
      - name: Publish multi-arch manifest (rung 1 - native builder)
        id: rung1
        continue-on-error: true
        uses: https://hangar.nixthedev.ru/docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
          cache-to: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true

      - name: Publish amd64 scratch tag (rung 2)
        id: rung2_amd
        if: steps.rung1.outcome == 'failure'
        continue-on-error: true
        uses: https://hangar.nixthedev.ru/docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.image }}:ci-amd64
          cache-from: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
          cache-to: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true

      - name: Publish arm64 scratch tag (rung 2)
        id: rung2_arm
        if: steps.rung1.outcome == 'failure'
        continue-on-error: true
        uses: https://hangar.nixthedev.ru/docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.image }}:ci-arm64
          cache-from: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
          cache-to: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true

      - name: Merge into manifest lists (rung 2)
        id: rung2_merge
        if: steps.rung2_amd.outcome == 'success' && steps.rung2_arm.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          amd="${{ steps.tags.outputs.image }}:ci-amd64"
          arm="${{ steps.tags.outputs.image }}:ci-arm64"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" "$amd" "$arm"
            echo "OK: $tag -> manifest list (linux/amd64 + linux/arm64)"
          done <<< "${{ steps.tags.outputs.tags }}"

      # Rung 3: the setup-buildx contract via setup-buildx-action -
      # docker-container driver (its default), pinned buildx version,
      # cache-binary on (its default). No continue-on-error here: if the
      # container builder cannot even start after rungs 1-2 failed, the job
      # is genuinely red.
      - name: Set up the buildkit container builder (rung 3)
        id: rung3_builder
        if: steps.rung1.outcome == 'failure' && (steps.rung2_merge.outcome == 'failure' || steps.rung2_merge.outcome == 'skipped')
        uses: https://hangar.nixthedev.ru/docker/setup-buildx-action@v3.12.0
        with:
          version: v0.38.1

      - name: Publish multi-arch manifest (rung 3 - container builder)
        id: rung3
        if: steps.rung3_builder.outcome == 'success'
        uses: https://hangar.nixthedev.ru/docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          builder: ${{ steps.rung3_builder.outputs.name }}
          cache-from: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }}
          cache-to: type=gha,url=https://acc.nixthedev.ru,token=${{ secrets.CACHETTE_BUILDX_JWT }},mode=max,ignore-error=true

      # Acceptance: the pushed head tag must be a manifest list covering BOTH
      # architectures (the version tag on `release`, the moving `dev` tag
      # elsewhere).
      - name: Verify manifest lists amd64 AND arm64
        run: |
          set -euo pipefail
          ref="${{ steps.tags.outputs.verify_ref }}"
          manifest="$(docker manifest inspect "$ref")"
          echo "$manifest"
          echo "$manifest" | grep -q '"architecture": "amd64"'
          echo "$manifest" | grep -q '"architecture": "arm64"'
          echo "OK: $ref is a manifest list with amd64 + arm64"

      # Boot-check of the PUBLISHED image: docker run pulls the runner's
      # native platform straight from the registry manifest list (arm64
      # runners get the arm64 image) and asserts the binary reports the
      # Cargo.toml-derived version. Gate LEVEL is context-dependent: a
      # release-branch push GATES red on it (the published version tag
      # must boot and report its version); every other ref stays green -
      # the failure is reported as NOTICE lines plus a ::notice::
      # annotation (dev WIP is allowed to not boot). This is the only
      # step that executes the pushed bytes.
      - name: Boot-check the published image
        id: bootcheck
        continue-on-error: true
        run: |
          set -euo pipefail
          ref="${{ steps.tags.outputs.verify_ref }}"
          want="cachette ${{ steps.tags.outputs.version }}"
          if ! got="$(docker run --rm "$ref" --version 2>&1)"; then
            echo "NOTICE: the published image did not boot: $ref"
            echo "$got"
            echo "::notice::The published image did not boot: $ref"
            exit 1
          fi
          echo "cachette --version => [$got]"
          # Derived from Cargo.toml in the tags step - a version bump can
          # never leave this check stale (a hardcoded 1.0.0 did go stale on
          # the 1.1.0 head, task 125, after a fully successful build).
          if [ "$got" = "$want" ]; then
            echo "OK: published image booted and reports [$want]"
          else
            echo "NOTICE: image booted but --version mismatch: [$got] != [$want]"
            echo "::notice::The published image booted with a version mismatch: [$got] != [$want]"
            exit 1
          fi
      # Re-raise the gate level where it matters: only a release-branch
      # push fails the JOB on a failed boot-check; everywhere else the
      # step above stays a noticed warning and the job remains green.
      - name: Enforce the release boot-check gate
        if: github.ref == 'refs/heads/release' && steps.bootcheck.outcome == 'failure'
        run: |
          echo "The published ${{ steps.tags.outputs.verify_ref }} failed its boot-check (see the step above); failing this release push."
          exit 1
