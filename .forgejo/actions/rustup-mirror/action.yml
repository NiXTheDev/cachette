name: rustup mirror ladder
description: >
  Race the rust distribution mirrors in parallel, export the fastest one
  that answered as RUSTUP_DIST_SERVER / RUSTUP_UPDATE_ROOT, so the
  toolchain fetch stops depending on the runners' flaky path to
  static.rust-lang.org.

# WHY THIS EXISTS
#
# The v1.1.0 release cut (run 108) died on every x86_64 leg BEFORE a
# single line was compiled, in two different places:
#
#   1. rustup-init fetch:
#      error: command failed: downloader
#      https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
#      warn: curl: (35) TLS connect error: SSL routines::unexpected eof while reading
#
#   2. toolchain channel fetch (the clippy job on the release branch):
#      info: syncing channel updates for 1.99-x86_64-unknown-linux-gnu
#      error: could not download file from
#      'https://static.rust-lang.org/dist/channel-rust-1.99.toml.sha256' ... tls handshake eof
#
# Both are the fleet's egress wall hitting static.rust-lang.org - the same
# wall the zig fetch already documented in release.yml (PR #7): connections
# die at the TLS layer, and WHICH mirror is fast varies by host and minute.
# The rustup-init download in particular has NO retry of its own (the
# rustup-init.sh bootstrapper calls curl once), so a single dropped
# connection kills the job.
#
# WHAT IT DOES
#
# Probes the mirror ladder and exports the two env vars rustup honours:
#
#   RUSTUP_DIST_SERVER  - root that mirrors static.rust-lang.org/
#                         (the channel manifests and toolchain archives)
#   RUSTUP_UPDATE_ROOT  - root that mirrors static.rust-lang.org/rustup/
#                         (where rustup-init itself lives)
#
# The ladder is a RACE, not a sequence: every mirror's probe runs in a
# background probe at once, and the FIRST one to return HTTP 200 for the
# stable channel manifest wins - i.e. the fastest non-errored mirror, not
# merely the first in some fixed order. The stragglers are killed as soon
# as a winner exists, so the wall-clock cost is the fastest healthy
# mirror's latency (a few seconds), never the sum of four connect
# timeouts (the old sequential version paid each dead mirror's
# 20s connect-timeout x2 retries x3s delay before even considering the
# next one). The probe itself carries no --retry: the other three racers
# ARE the retry - if one mirror TLS-EOFs instantly, the race continues
# without it.
#
# Nothing else changes: the dtolnay/rust-toolchain composite still installs
# rustup and the pinned toolchain, but both fetches now go through the
# mirror that actually won. The composite does not define either var, so
# the exported values reach its steps untouched.
#
# The probe fetches a channel manifest (a few hundred bytes), never a
# toolchain archive, so the ladder costs nothing but one round-trip per
# mirror per job.
#
# When NOTHING answers inside the deadline it leaves the defaults in
# place and warns - the composite's own retries then apply, exactly as
# before this action.

runs:
  using: composite
  steps:
    - name: Race the rust mirror ladder
      shell: sh
      run: |
        set -eu
        # Hard-link trick for atomic first-wins: each probe gets a
        # pre-written candidate file; `ln` into the winner slot fails with
        # EEXIST for every probe but the first to succeed, so two probes
        # finishing in the same instant cannot interleave their writes.
        race="${TMPDIR:-/tmp}/rustup-mirror-race"
        rm -rf "$race"
        mkdir -p "$race"
        pids=""
        i=0
        while IFS='|' read -r dist update; do
          [ -n "${dist:-}" ] || continue
          i=$((i + 1))
          printf '%s|%s\n' "$dist" "$update" > "$race/cand.$i"
          (
            if curl -fsSL --connect-timeout 15 --max-time 45 \
                      -o /dev/null "$dist/dist/channel-rust-stable.toml.sha256"; then
              ln "$race/cand.$i" "$race/winner" 2>/dev/null || true
              echo "rust mirror probe answered: $dist"
            else
              echo "::warning::rust mirror unreachable: $dist"
            fi
          ) &
          pids="$pids $!"
        done <<'MIRRORS'
        https://rsproxy.cn|https://rsproxy.cn/rustup
        https://mirrors.ustc.edu.cn/rust-static|https://mirrors.ustc.edu.cn/rust-static/rustup
        https://mirrors.tuna.tsinghua.edu.cn/rustup|https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup
        https://static.rust-lang.org|https://static.rust-lang.org/rustup
        MIRRORS
        # First successful completion wins. Poll a deadline (covers the
        # case where every probe is still fighting the egress wall), then
        # kill the stragglers so nothing outlives the step.
        deadline=$(( $(date +%s) + 60 ))
        while [ ! -e "$race/winner" ] && [ "$(date +%s)" -lt "$deadline" ]; do
          sleep 1
        done
        kill $pids 2>/dev/null || true
        wait || true
        if [ -e "$race/winner" ]; then
          IFS='|' read -r dist update < "$race/winner"
          echo "picked mirror (first to answer): dist=$dist update=$update"
          echo "RUSTUP_DIST_SERVER=$dist" >> "$GITHUB_ENV"
          echo "RUSTUP_UPDATE_ROOT=$update" >> "$GITHUB_ENV"
        else
          echo "::warning::no rust mirror answered - keeping the upstream defaults"
        fi
